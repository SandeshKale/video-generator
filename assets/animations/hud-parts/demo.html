<!doctype html><meta charset="utf-8"><title>HUD parts demo</title>
<style>html,body{margin:0;background:#070b1f}svg{display:block}</style>
<svg id="v" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script src="hud.js"></script>
<script>
// Demo scene: every part is a pure function of t; __seek just re-renders.
var CYAN='#39e6c4', YEL='#ffd21f', RED='#ff4d6d';
window.__reelDurationSec = 6;
window.__seek = function (t) {
  var lit=[[1,1,.5],[2,1,.9],[2,2,1.3],[3,2,1.7],[4,3,2.1],[5,3,2.5],[5,4,2.9]];
  var s = '<g transform="translate(150 190)">' + HUD.glowCard(t,{t0:.1,text:'STORE 17 · 2 · 31',eyebrow:'// SYSTEM DESIGN · 018',w:780,h:190,fs:54,color:YEL}) + '</g>';
  s += '<g transform="translate(150 470)">' + HUD.geofence(t,{pts:[[40,60],[330,0],[620,90],[700,300],[430,420],[90,350]],color:CYAN,t0:.4,dur:1.4,label:'YOUR CELL'}) + '</g>';
  s += '<g transform="translate(150 930)">' + HUD.gridCells(t,{cols:8,rows:6,cell:70,lit:lit,color:CYAN}) + '</g>';
  s += '<g transform="translate(150 1590)">' + HUD.rayCast(t,{origin:[40,150],targets:[[330,30],[400,110],[470,190],[560,70],[640,150],[700,240]],color:RED,t0:.8}) + '</g>';
  s += '<g transform="translate(150 1440)">' + HUD.barChart(t,{values:[4,9,7,16,12],max:16,labels:['A','B','C','D','E'],w:700,h:130,highlight:3,color:YEL,t0:1.6,fs:20}) + '</g>';
  document.getElementById('v').innerHTML = s;
};
window.__seek(0);
</script>
