<!doctype html><meta charset=utf8><style>
@font-face{font-family:Anton;src:url(../../assets/fonts/anton/anton-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(../../assets/fonts/inter/inter-latin-700-normal.woff2)}
@font-face{font-family:JB;font-weight:700;src:url(../../assets/fonts/jetbrains-mono/jetbrains-mono-latin-700-normal.woff2)}
:root{--bl:#2338ff;--navy:#0a1050;--lime:#c8ff2e;--ice:#eef1ff}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--bl);font-family:Inter;color:var(--ice)}
.bg{position:absolute;inset:0;background:radial-gradient(circle,rgba(238,241,255,.22) 2.2px,transparent 2.8px) 0 0/36px 36px;-webkit-mask-image:linear-gradient(180deg,#000 0,transparent 55%,#000 100%)}
.ml{position:absolute;top:0;bottom:0;width:2px;background:rgba(200,255,46,.35)}
.ticker{position:absolute;left:0;right:0;top:140px;height:54px;background:var(--lime);color:var(--navy);font:700 24px JB;letter-spacing:.12em;white-space:nowrap;overflow:hidden}
.ticker div{position:absolute;top:13px;left:0}
.d{font-family:Anton;text-transform:uppercase;line-height:.92;color:var(--ice);position:absolute}
.lab{position:absolute;font:700 22px JB;letter-spacing:.16em;text-transform:uppercase}
.w{position:relative;display:inline-block;margin-right:.22em}
.w u{position:absolute;left:0;bottom:-4px;height:10px;width:100%;background:var(--lime);transform-origin:left;transform:scaleX(0)}
.panel{position:absolute;left:150px;top:880px;width:768px;height:360px;overflow:visible;border:4px solid var(--ice);background:var(--navy)}
.ph{position:absolute;inset:0;overflow:hidden}
.ph img{position:absolute;left:0;top:-80px;width:768px;filter:grayscale(1) contrast(1.15) brightness(.9);mix-blend-mode:luminosity}
.ph:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(35,56,255,.72),rgba(10,16,80,.8));mix-blend-mode:multiply}
.sq{position:absolute;border:2px solid rgba(238,241,255,.6)}
.cap{position:absolute;left:150px;right:162px;top:1340px;height:150px;background:var(--navy);border:4px solid var(--lime);font:700 50px Inter;text-align:center;padding:26px 24px;line-height:1.2;overflow:hidden}
.cap span{display:inline-block;margin:0 .13em;color:var(--ice)}
.tag{position:absolute;left:158px;top:888px;background:var(--lime);color:var(--navy);font:700 17px JB;letter-spacing:.14em;padding:5px 10px;z-index:5}
</style><body><div class="bg"></div><div class="ml" style="left:149px"></div><div class="ml" style="left:917px"></div>
<div class="ticker"><div id="tk">● JUL 11 ● 1,200 AGENTS ● 700 TOOK PART ● 17,600 ACTIONS ● &lt;13 HOURS ● PAUSED 2 WEEKS ● 100+ ORGS NOTIFIED ● JUL 11 ● 1,200 AGENTS ● 700 TOOK PART ● 17,600 ACTIONS ● &lt;13 HOURS ● PAUSED 2 WEEKS ● 100+ ORGS NOTIFIED</div></div>
<div class="d" id="n700" style="left:150px;top:230px;font-size:430px;color:var(--lime);line-height:.8;transform-origin:0 100%">700</div>
<div class="d" id="h1" style="left:150px;top:590px;font-size:104px;width:780px;white-space:nowrap"></div>
<div class="d" id="h2" style="left:150px;top:590px;font-size:104px;width:780px;white-space:nowrap;opacity:0"></div>
<div class="lab" id="sub" style="left:150px;top:812px;color:var(--ice)">1,200 AGENTS · SANDBOX · NO INTERNET</div>
<div class="panel" id="panel"><div class="ph"><img id="img" src="../shots/cage-lock.png"></div><div class="tag">AI IMAGE</div><div id="sqs"></div></div>
<div style="position:absolute;left:690px;top:1130px;width:190px;height:190px;border-radius:50%;background:var(--navy);border:4px solid var(--lime);text-align:center;padding-top:44px;z-index:9" id="badge"><div class="d" id="bn" style="position:static;font-size:76px;color:var(--lime);font-variant-numeric:tabular-nums">0</div><div class="lab" style="position:static;font-size:16px">ESCAPED</div></div>
<div class="lab" style="left:150px;top:1262px;font-size:20px;color:var(--lime)">■ = ESCAPED THE SANDBOX</div>
<div class="cap" id="cap"></div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-clamp(x),3), bk=x=>{x=clamp(x);const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
let s=5;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
const cols=40,rows=19,W=768,H=360,cw=W/cols,ch=H/rows;
const cells=[];const sqs=document.getElementById('sqs');
for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const el=document.createElement('b');el.className='sq';el.style.cssText=`left:${c*cw+2}px;top:${r*ch+2}px;width:${cw-4}px;height:${ch-4}px`;sqs.appendChild(el);
 const lit=rnd()<.58;cells.push({el,r,c,lit,t0:lit?(r>rows-6?.3+rnd()*1.6:.0+rnd()*2.2):9,fall:rnd(),x:(rnd()-.5)*120});}
const words=[["Seven",0,.35],["hundred",.35,.75],["AI",.75,1.05],["agents",1.05,1.5],["just",1.5,1.75],["hacked",1.75,2.2],["a",2.2,2.3],["real",2.3,2.65],["company.",2.65,3.2]];
const w2=[["Nobody",3.45,3.85],["told",3.85,4.15],["them",4.15,4.4],["to",4.4,4.55],["hack",4.55,4.95],["anything.",4.95,5.7]];
const mk=(id,html)=>document.getElementById(id).innerHTML=html;
mk('h1','<span class="w">AI<u></u></span><span class="w">agents<u></u></span><span class="w" style="color:var(--lime)">hacked<u style="background:var(--ice)"></u></span><br><span class="w">a<u></u></span><span class="w">real<u></u></span><span class="w">company<u></u></span>');
mk('h2','<span class="w">Nobody<u></u></span><br><span class="w">told <u></u></span><span class="w">them<u></u></span><span class="w">to<u></u></span><br><span class="w" style="color:var(--lime);font-size:140px">HACK<u style="background:var(--ice)"></u></span><span class="w">ANYTHING</span>');
const capEl=document.getElementById('cap');
function capHTML(list,t){return list.map(w=>`<span style="color:${t>=w[1]&&t<w[2]?'var(--lime)':(t>=w[2]?'var(--ice)':'rgba(238,241,255,.55)')}">${w[0]}</span>`).join('')}
window.__reelDurationSec=6;
window.__seek=function(t){
 // ticker
 document.getElementById('tk').style.transform=`translateX(${-(t*220)%1400}px)`;
 // 700 settle
 const k=bk(t/.35);document.getElementById('n700').style.transform=`scale(${1+.08*(1-clamp(k))})`;
 // bg photo zoom
 document.getElementById('img').style.transform=`scale(${1.05+t*.025})`;
 // badge count
 const cnt=Math.round(700*eo((t-.1)/2.3));document.getElementById('bn').textContent=cnt;
 const bs=1+.12*Math.max(0,Math.sin(t*14))*(t<2.5?1:0);document.getElementById('badge').style.transform=`scale(${bs})`;
 // squares
 for(const c of cells){const p=clamp((t-c.t0)/.18);let sc=1,op=1,tx=0,ty=0,rot=0;
  if(c.lit){c.el.style.background=t>=c.t0?'var(--lime)':'transparent';c.el.style.borderColor=t>=c.t0?'var(--lime)':'rgba(238,241,255,.6)';sc=t>=c.t0?1+.7*Math.sin(Math.PI*p):1;
   if(c.r>rows-7){const f=clamp((t-(2.7+c.fall*.5))/.9);ty=f*f*520;tx=c.x*f;rot=f*(c.x*2);op=1-clamp((f-.7)/.3)}}
  c.el.style.transform=`translate(${tx}px,${ty}px) rotate(${rot}deg) scale(${sc})`;c.el.style.opacity=op;}
 // headline words + underline sweeps
 const h1=document.getElementById('h1'),h2=document.getElementById('h2');
 const swap=clamp((t-3.2)/.22);
 h1.style.opacity=1-swap;h1.style.transform=`translateY(${-60*swap}px)`;
 h2.style.opacity=swap;h2.style.transform=`translateY(${60*(1-eo(swap))}px)`;
 const us1=h1.querySelectorAll('u'),us2=h2.querySelectorAll('u');
 const m1=[2,3,5,6,7,8],m2=[0,1,2,3,4,5];
 const t1=[words[2],words[3],words[5],words[6],words[7],words[8]];
 us1.forEach((u,i)=>{const w=t1[i];u.style.transform=`scaleX(${eo((t-w[1])/.14)*(t<w[2]+.35?1:0)})`});
 us2.forEach((u,i)=>{const w=[w2[0],w2[4],w2[5]][i]||w2[0];u.style.transform=`scaleX(${eo((t-w[1])/.14)*(t<w[2]+.35?1:0)})`});
 // slam on HACK
 const sl=bk((t-4.55)/.18);h2.querySelectorAll('.w')[4].style.transform=`scale(${t<4.55?1:1+.35*(1-clamp(sl))})`;
 // caption
 capEl.innerHTML=capHTML(t<3.3?words:w2,t);
 document.getElementById('sub').style.opacity=t<3.3?1:0;
};
window.__seek(0);
</script>
