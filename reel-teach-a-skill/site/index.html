<!doctype html><html><head><meta charset="utf8"><title>Teach your AI once</title><style>
@font-face{font-family:DS;src:url('fonts/dm-serif-display-latin-400-normal.woff2');font-weight:400;font-display:block}
@font-face{font-family:CP;src:url('fonts/courier-prime-latin-700-normal.woff2');font-weight:700;font-display:block}
@font-face{font-family:CP;src:url('fonts/courier-prime-latin-400-normal.woff2');font-weight:400;font-display:block}
@font-face{font-family:IN;src:url('fonts/inter-latin-700-normal.woff2');font-weight:700;font-display:block}
@font-face{font-family:IN;src:url('fonts/inter-latin-500-normal.woff2');font-weight:500;font-display:block}
:root{--walnut:#2b1a12;--brass:#c9a04f;--brass2:#8a6a2c;--card:#f5eedb;--navy:#20396b;--red:#d1442f;--green:#3e7a5a;--ink:#f3ead6;--gold:#f0c76a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#160c08}
#gl{position:absolute;left:0;top:0;width:1080px;height:1920px;display:none}
#bg{position:absolute;inset:0;background:radial-gradient(900px 700px at 22% 12%,rgba(255,190,110,.20),transparent 70%),radial-gradient(1200px 900px at 50% 110%,rgba(0,0,0,.55),transparent 70%),linear-gradient(180deg,#33201a,#22140e 60%,#160c08)}
#bg svg{position:absolute;left:0;top:0;opacity:.22;mix-blend-mode:overlay}
#motes{position:absolute;inset:0;pointer-events:none}
.mote{position:absolute;border-radius:50%;background:#ffd9a0;filter:blur(1px)}
#st{position:absolute;inset:0;overflow:hidden;font-family:IN;color:var(--ink);perspective:1700px;perspective-origin:50% 40%}
.sc{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:50% 0;backface-visibility:hidden}
.tracker{position:absolute;left:150px;top:150px;width:768px;height:92px;border-radius:10px;z-index:5;
  background:linear-gradient(180deg,#d9b866,#b48a3c 55%,#94702c);box-shadow:0 10px 24px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,240,200,.6),inset 0 -2px 0 rgba(60,40,10,.5);display:flex;align-items:center;padding:0 14px;gap:10px}
.tracker .lbl{font:700 22px/1.05 CP;color:#2a1a08;letter-spacing:.12em;width:150px}
.tracker .dw{flex:1;height:64px;border-radius:6px;background:linear-gradient(180deg,#4a2c1d,#2e1a10);box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),0 2px 0 rgba(255,230,180,.25);display:flex;align-items:center;justify-content:center;gap:10px;font:700 21px CP;color:#cdb382;letter-spacing:.06em}
.tracker .dw .n{width:30px;height:30px;border-radius:50%;border:2px solid #cdb382;display:flex;align-items:center;justify-content:center;font-size:18px}
.tracker .dw.on{background:linear-gradient(180deg,#f5eedb,#e6dcc0);color:var(--navy);box-shadow:0 8px 14px rgba(0,0,0,.4)}
.tracker .dw.on .n{border-color:var(--navy);background:var(--navy);color:var(--card)}
.tracker .dw.done{color:#9fc7a9}.tracker .dw.done .n{border-color:#9fc7a9}
.eb{position:absolute;left:150px;top:278px;font:700 25px CP;letter-spacing:.14em;color:var(--brass);text-shadow:0 2px 8px rgba(0,0,0,.6);white-space:nowrap}
.hd{position:absolute;left:150px;width:780px;top:318px;font:400 76px/1.04 DS;letter-spacing:-.02em;color:var(--ink);text-shadow:0 4px 14px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.8)}
.hd em{font-style:normal;color:var(--gold)}
#cap{position:absolute;left:150px;width:768px;top:1338px;padding:18px 26px;border-radius:14px;background:rgba(18,10,6,.82);box-shadow:0 8px 24px rgba(0,0,0,.5);font:700 40px/1.28 IN;color:#a99a80;text-align:center;z-index:9}
#cap .w{color:#efe4cc}#cap .cur{color:#ffd77a}
.card{position:absolute;background:repeating-linear-gradient(180deg,transparent 0 47px,rgba(70,110,170,.28) 47px 49px),linear-gradient(90deg,transparent 0 70px,rgba(209,68,47,.55) 70px 72px,transparent 72px),var(--card);border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.55),0 2px 0 #fff inset;color:var(--navy)}
.plain{position:absolute;background:var(--card);border-radius:8px;box-shadow:0 16px 34px rgba(0,0,0,.55);color:#1d2230}
.chip{position:absolute;font:700 22px CP;letter-spacing:.08em;padding:10px 16px;border-radius:6px;white-space:nowrap}
.tagcard{position:absolute;background:var(--card);color:var(--navy);border-radius:5px;padding:12px 16px 12px 22px;box-shadow:0 10px 22px rgba(0,0,0,.5);font:700 21px/1.25 CP;letter-spacing:.04em}
.tagcard::before{content:'';position:absolute;left:10px;top:10px;bottom:10px;width:3px;background:var(--red);opacity:.7}
.tagcard small{display:block;font:500 19px/1.3 IN;letter-spacing:0;color:#4a4a52;margin-top:4px}
.leader{position:absolute;height:3px;background:var(--brass);transform-origin:0 50%;box-shadow:0 0 8px rgba(201,160,79,.6)}
.leader::after{content:'';position:absolute;right:-7px;top:-6px;width:15px;height:15px;border-radius:50%;background:var(--brass)}
.illus{position:absolute;font:700 16px CP;letter-spacing:.16em;color:#a8936f;background:rgba(20,12,8,.7);padding:5px 10px;border-radius:4px;white-space:nowrap}
.stamp{position:absolute;font:700 46px/1 CP;letter-spacing:.06em;color:var(--red);border:6px solid var(--red);padding:10px 18px;border-radius:8px;white-space:nowrap;background:rgba(245,238,219,.15);mix-blend-mode:multiply}
.stamp.dark{mix-blend-mode:normal;background:rgba(20,12,8,.82)}
.bub{position:absolute;background:var(--navy);color:var(--ink);border-radius:20px 20px 6px 20px;padding:18px 24px;font:500 28px/1.32 IN;box-shadow:0 14px 28px rgba(0,0,0,.5)}
.bub .pt{position:absolute;right:16px;top:-16px;font:700 16px CP;letter-spacing:.14em;background:var(--brass);color:#2a1a08;padding:5px 9px;border-radius:4px}
.hl{border-radius:4px;padding:0 3px}
.vid{position:absolute;left:-1165px;top:0;height:1920px;width:3411px;pointer-events:none;display:none;z-index:8}
.lg svg{width:100%;height:100%;display:block}
.cab{position:absolute}
.cab canvas{position:absolute;left:0;top:0;filter:drop-shadow(0 30px 40px rgba(0,0,0,.6))}
.cab .pl{position:absolute;text-align:center;font-family:CP;font-weight:700;color:#20396b;white-space:nowrap;overflow:hidden;line-height:18px}
.key{position:absolute;width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#2c2f36,#0b0c0f);box-shadow:0 0 0 5px #b9bdc4,0 0 0 7px #5d6168,0 10px 16px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font:700 30px CP;color:#f3ead6}
.key.dn{box-shadow:0 0 0 5px #e1c26f,0 0 0 7px #7a5e22,0 4px 8px rgba(0,0,0,.6)}
.tg{position:absolute;width:96px;height:52px;border-radius:26px;background:#5d5446;box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.tg i{position:absolute;top:6px;left:6px;width:40px;height:40px;border-radius:50%;background:#f5eedb;box-shadow:0 3px 6px rgba(0,0,0,.4)}
.warn{position:absolute;left:150px;width:768px;height:150px;background:var(--card);border-radius:6px;box-shadow:0 16px 30px rgba(0,0,0,.6);color:#1d2230;display:flex;align-items:center;gap:22px;padding:0 26px 0 0;overflow:hidden}
.warn .tb{width:110px;height:100%;background:var(--red);display:flex;align-items:center;justify-content:center;color:#fff4e6;flex:none}
.warn b{display:block;font:700 30px/1.15 CP;letter-spacing:.04em;color:#1d2230}
.warn span{display:block;font:500 24px/1.3 IN;color:#4a4a52;margin-top:6px}
.btn{position:absolute;font:700 34px/1 CP;letter-spacing:.1em;padding:20px 30px;border-radius:10px;white-space:nowrap;box-shadow:0 10px 20px rgba(0,0,0,.45)}
</style></head><body><canvas id="gl" width="1080" height="1920"></canvas>
<div id="bg"><svg width="1080" height="1920"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".004 .09" numOctaves="3" seed="4"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .32  0 0 0 0 .18  0 0 0 1.4 -.35"/></filter><rect width="1080" height="1920" filter="url(#g)"/></svg></div>
<div id="motes"></div><div id="st"></div>
<script src="timing.js"></script><script src="ic.js"></script><script src="hum.js"></script><script src="mocap.js"></script><script src="rig.js"></script><script src="3d/cab.js"></script><script src="gl.js"></script><script src="app.js"></script></body></html>
