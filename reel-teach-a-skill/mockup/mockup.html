<!doctype html>
<html><head><meta charset="utf-8"><title>Card Catalogue mockup</title>
<style>
@font-face{font-family:'DM Serif Display';src:url('../../assets/fonts/dm-serif-display/dm-serif-display-latin-400-normal.woff2') format('woff2');font-weight:400;font-display:block}
@font-face{font-family:'Courier Prime';src:url('../../assets/fonts/courier-prime/courier-prime-latin-700-normal.woff2') format('woff2');font-weight:700;font-display:block}
@font-face{font-family:'Courier Prime';src:url('../../assets/fonts/courier-prime/courier-prime-latin-400-normal.woff2') format('woff2');font-weight:400;font-display:block}
@font-face{font-family:'Inter';src:url('../../assets/fonts/inter/inter-latin-700-normal.woff2') format('woff2');font-weight:700;font-display:block}
@font-face{font-family:'Inter';src:url('../../assets/fonts/inter/inter-latin-500-normal.woff2') format('woff2');font-weight:500;font-display:block}
:root{--walnut:#2b1a12;--walnut2:#1a0f0a;--brass:#c9a04f;--brass2:#8a6a2c;--card:#f5eedb;--navy:#20396b;--red:#d1442f;--green:#3e7a5a;--ink:#f3ead6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--walnut2)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif;color:var(--ink);
  background:
   radial-gradient(900px 700px at 22% 12%,rgba(255,190,110,.20),transparent 70%),
   radial-gradient(1200px 900px at 50% 110%,rgba(0,0,0,.55),transparent 70%),
   linear-gradient(180deg,#33201a,#22140e 60%,#160c08)}
/* wood grain: long horizontal streaks, very low contrast */
#grain{position:absolute;inset:0;opacity:.22;mix-blend-mode:overlay}
#motes{position:absolute;inset:0;pointer-events:none}
.mote{position:absolute;border-radius:50%;background:#ffd9a0;filter:blur(1px)}
/* step tracker: a brass rail with four drawer-fronts */
.tracker{position:absolute;left:150px;top:150px;width:768px;height:92px;border-radius:10px;
  background:linear-gradient(180deg,#d9b866,#b48a3c 55%,#94702c);box-shadow:0 10px 24px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,240,200,.6),inset 0 -2px 0 rgba(60,40,10,.5);
  display:flex;align-items:center;padding:0 14px;gap:10px}
.tracker .lbl{font:700 22px 'Courier Prime';color:#2a1a08;letter-spacing:.12em;width:150px;line-height:1.05}
.tracker .dw{flex:1;height:64px;border-radius:6px;background:linear-gradient(180deg,#4a2c1d,#2e1a10);box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),0 2px 0 rgba(255,230,180,.25);
  display:flex;align-items:center;justify-content:center;gap:10px;font:700 21px 'Courier Prime';color:#cdb382;letter-spacing:.06em}
.tracker .dw .n{width:30px;height:30px;border-radius:50%;border:2px solid #cdb382;display:flex;align-items:center;justify-content:center;font-size:18px}
.tracker .dw.on{background:linear-gradient(180deg,#f5eedb,#e6dcc0);color:var(--navy);transform:translateY(8px);box-shadow:0 8px 14px rgba(0,0,0,.4)}
.tracker .dw.on .n{border-color:var(--navy);background:var(--navy);color:var(--card)}
.tracker .dw.done{color:#9fc7a9}.tracker .dw.done .n{border-color:#9fc7a9}
.eyebrow{position:absolute;left:150px;top:278px;font:700 25px 'Courier Prime';letter-spacing:.14em;color:var(--brass);text-shadow:0 2px 8px rgba(0,0,0,.6)}
.head{position:absolute;left:150px;width:768px;top:318px;font:400 76px/1.04 'DM Serif Display';letter-spacing:-.02em;color:var(--ink);
  text-shadow:0 4px 14px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.8)}
.head em{font-style:normal;color:#f0c76a}
/* captions */
.cap{position:absolute;left:150px;width:768px;top:1338px;padding:18px 26px;border-radius:14px;background:rgba(18,10,6,.78);box-shadow:0 8px 24px rgba(0,0,0,.5);
  font:700 40px/1.28 Inter;color:#d8ccb4;text-align:center}
.cap b{color:#ffd77a}
/* index card */
.card{position:absolute;background:
  repeating-linear-gradient(180deg,transparent 0 47px,rgba(70,110,170,.28) 47px 49px),
  linear-gradient(90deg,transparent 0 70px,rgba(209,68,47,.55) 70px 72px,transparent 72px),
  var(--card);border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.55),0 2px 0 #fff inset;color:var(--navy)}
.card::after{content:'';position:absolute;inset:0;border-radius:6px;opacity:.35;mix-blend-mode:multiply;background-image:var(--fibre)}
.chip{position:absolute;font:700 22px 'Courier Prime';letter-spacing:.08em;padding:10px 16px;border-radius:6px}
.tagcard{position:absolute;background:var(--card);color:var(--navy);border-radius:5px;padding:12px 16px 12px 22px;box-shadow:0 10px 22px rgba(0,0,0,.5);
  font:700 21px/1.25 'Courier Prime';letter-spacing:.04em}
.tagcard::before{content:'';position:absolute;left:10px;top:10px;bottom:10px;width:3px;background:var(--red);opacity:.7}
.tagcard small{display:block;font:500 19px/1.3 Inter;letter-spacing:0;color:#4a4a52;margin-top:4px}
.leader{position:absolute;height:3px;background:var(--brass);transform-origin:0 50%;box-shadow:0 0 8px rgba(201,160,79,.6)}
.leader::after{content:'';position:absolute;right:-7px;top:-6px;width:15px;height:15px;border-radius:50%;background:var(--brass)}
.illus{position:absolute;font:700 16px 'Courier Prime';letter-spacing:.16em;color:#8f7a5a;background:rgba(20,12,8,.6);padding:5px 10px;border-radius:4px}
.hl{border-radius:4px;padding:0 3px}
</style></head>
<body><div id="stage"><svg id="grain" width="1080" height="1920"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".004 .09" numOctaves="3" seed="4"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .32  0 0 0 0 .18  0 0 0 1.4 -.35"/></filter><rect width="1080" height="1920" filter="url(#g)"/></svg><div id="motes"></div><div id="scene"></div></div>
<script src="../site/mocap.js"></script><script src="../site/rig.js"></script>
<script>
var S = +(location.hash.slice(1) || 2), root = document.getElementById('scene');
var fibre = "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='f'><feTurbulence baseFrequency='.9' numOctaves='2' seed='7'/><feColorMatrix values='0 0 0 0 .55 0 0 0 0 .5 0 0 0 0 .4 0 0 0 .9 0'/></filter><rect width='300' height='300' filter='url(%23f)'/></svg>\")";
document.documentElement.style.setProperty('--fibre', fibre);
function h(html){root.insertAdjacentHTML('beforeend', html);}
// dust motes in the lamp light (deterministic positions; in the build they drift as a function of t)
(function(){var m='',r=7;for(var i=0;i<26;i++){r=(r*9301+49297)%233280;var x=60+(r/233280)*700;r=(r*9301+49297)%233280;var y=80+(r/233280)*900;var s=2+(i%3);m+='<div class="mote" style="left:'+x.toFixed(0)+'px;top:'+y.toFixed(0)+'px;width:'+s+'px;height:'+s+'px;opacity:'+(.15+(i%5)*.06)+'"></div>';}document.getElementById('motes').innerHTML=m;})();
function tracker(cur, label){
  var names=['PICK','ASK','SAVE','TEST'],s='<div class="tracker"><div class="lbl">'+label+'</div>';
  names.forEach(function(n,i){s+='<div class="dw '+(i+1===cur?'on':(i+1<cur?'done':''))+'"><span class="n">'+(i+1<cur?'✓':i+1)+'</span>'+n+'</div>';});
  h(s+'</div>');
}
function caption(words, hi){h('<div class="cap">'+words.split(' ').map(function(w,i){return i===hi?'<b>'+w+'</b>':w;}).join(' ')+'</div>');}
function leader(x1,y1,x2,y2){var dx=x2-x1,dy=y2-y1;h('<div class="leader" style="left:'+x1+'px;top:'+y1+'px;width:'+Math.hypot(dx,dy).toFixed(0)+'px;transform:rotate('+(Math.atan2(dy,dx)*180/Math.PI).toFixed(1)+'deg)"></div>');}

if (S === 2) {
  tracker(0,'FOUR<br>STEPS');
  h('<div class="eyebrow">// WHAT A SKILL IS</div>');
  h('<div class="head">A skill is an <em>instruction card.</em></div>');
  // cabinet render: 1080x1240 -> 820 wide
  var k=760/1080, X=160, Y=505;
  h('<img src="../site/3d/cab_open.png" style="position:absolute;left:'+X+'px;top:'+Y+'px;width:760px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.6))">');
  fetch('../site/3d/cab_open.json').then(function(r){return r.json();}).then(function(d){
    // DOM type on every plate (the render leaves them blank)
    var names=['brand','notes','sql','bills','hire','legal','weekly','ship','bugs','pitch','spend','style','posts','csv','okr','viz','api','email','tests','retro','trips','meals','pr','intro'];
    d.plates.forEach(function(p){ if(p.card) return;
      var i=p.c*6+p.r, w=p.w*k*0.98;
      h('<div style="position:absolute;left:'+(X+p.x*k-w/2).toFixed(1)+'px;top:'+(Y+p.y*k-9).toFixed(1)+'px;width:'+w.toFixed(1)+'px;text-align:center;font:700 '+(p.c===1&&p.r===0?12:11)+'px/18px \'Courier Prime\';color:#20396b;white-space:nowrap;overflow:hidden;transform:rotate('+p.skew+'deg)">'+names[i]+'</div>');});
    var pl=d.plates.filter(function(p){return p.c===1&&p.r===0;})[0], cd=d.plates.filter(function(p){return p.card;})[0];
    var px=X+pl.x*k, py=Y+pl.y*k, cx=X+cd.x*k, cy=Y+cd.y*k;
    // manila envelope clipped to the lifted card (scripts & files)
    h('<div style="position:absolute;left:'+(cx+30).toFixed(0)+'px;top:'+(cy-26).toFixed(0)+'px;width:46px;height:32px;transform:rotate(8deg);background:linear-gradient(180deg,#d9b77a,#b8924f);border-radius:3px;box-shadow:0 4px 8px rgba(0,0,0,.5)"><div style="position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 60%);background:#c7a264"></div><div style="position:absolute;left:19px;top:13px;width:9px;height:9px;border-radius:50%;background:#d1442f"></div></div>');
    // callouts: card (left, above the cabinet), envelope (right, above), label (right, on the drawer row)
    h('<div class="tagcard" style="left:150px;top:500px;width:260px">CARD<small>the instructions · pulled only when a request matches</small></div>');
    leader(410,560,cx-14,cy-6);
    h('<div class="tagcard" style="left:620px;top:500px;width:298px">ENVELOPE<small>scripts &amp; files · opened only if needed</small></div>');
    leader(620,560,cx+60,cy-20);
    h('<div class="tagcard" style="left:620px;top:1110px;width:298px">LABEL = name + description<small>always on the front · ~100 tokens</small></div>');
    var rp=d.plates.filter(function(p){return p.c===3&&p.r===3;})[0];
    leader(700,1110,X+rp.x*k,Y+rp.y*k+12);
  });
  caption('A skill is a small instruction file Claude pulls out only when needed.', 10);
}

if (S === 5) {
  tracker(2,'STEP<br>2 OF 4');
  h('<div class="eyebrow">// THE CARD CLAUDE WRITES</div>');
  h('<div class="head">Name + description:<br><em>what, and when.</em></div>');
  // typewriter: platen roller above the card, keys below
  h('<div style="position:absolute;left:120px;top:500px;width:840px;height:64px;border-radius:32px;background:linear-gradient(180deg,#3a3d44,#0e0f12 60%,#24262b);box-shadow:0 12px 24px rgba(0,0,0,.6)"></div>');
  h('<div style="position:absolute;left:96px;top:512px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f4e2b0,#a8873f 60%,#5b4419)"></div><div style="position:absolute;left:944px;top:512px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f4e2b0,#a8873f 60%,#5b4419)"></div>');
  var code=[
   ['<span style="opacity:.55">---</span>'],
   ['name: <span id="nm">weekly-team-update</span>'],
   ['description: <span class="hl" style="background:rgba(255,214,90,.55)">Drafts my weekly update</span>'],
   ['  <span class="hl" style="background:rgba(255,214,90,.55)">(wins, blockers, priorities).</span>'],
   ['  <span class="hl" style="background:rgba(110,190,140,.5)">Use when I ask for my team update.</span>'],
   ['<span style="opacity:.55">---</span>'],
   ['## Instructions'],
   ['- Three bullets max per section'],
   ['- Direct tone, for my manager'],
   ['- Match the example I liked<span style="display:inline-block;width:14px;height:30px;background:#20396b;vertical-align:-5px;margin-left:4px"></span>']];
  h('<div class="card" style="left:150px;top:536px;width:780px;height:600px;transform:rotate(-1.2deg);padding:40px 30px 0 92px;font:700 29px/48px \'Courier Prime\';white-space:pre">'+code.map(function(l){return l[0];}).join('\n')+'</div>');
  // brass ruler under the name line, with check tags
  h('<div style="position:absolute;left:238px;top:668px;width:420px;height:12px;transform:rotate(-1.2deg);border-radius:3px;background:repeating-linear-gradient(90deg,#5b4419 0 2px,transparent 2px 12px),linear-gradient(180deg,#e5c77a,#b48a3c);box-shadow:0 4px 8px rgba(0,0,0,.35);opacity:.95"></div>');
  h('<div class="chip" style="left:560px;top:578px;background:var(--green);color:#f3ead6;transform:rotate(-1.2deg);box-shadow:0 6px 12px rgba(0,0,0,.35)">✓ ≤ 64 CHARS · a-z-</div>');
  h('<div class="chip" style="left:330px;top:818px;background:#f0c040;color:#2a1a08;transform:rotate(-2deg);box-shadow:0 6px 12px rgba(0,0,0,.35)">▲ WHAT ✓</div>');
  h('<div class="chip" style="left:510px;top:818px;background:var(--green);color:#f3ead6;transform:rotate(1deg);box-shadow:0 6px 12px rgba(0,0,0,.35)">▲ WHEN ✓</div>');
  // keys row
  var keys='QWERTYUI'.split(''),ks='';keys.forEach(function(c,i){ks+='<div style="position:absolute;left:'+(158+i*96)+'px;top:1158px;width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#2c2f36,#0b0c0f);box-shadow:0 0 0 5px #b9bdc4,0 0 0 7px #5d6168,0 10px 16px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font:700 30px \'Courier Prime\';color:#f3ead6;'+(i===2?'transform:translateY(8px);box-shadow:0 0 0 5px #e1c26f,0 0 0 7px #7a5e22,0 4px 8px rgba(0,0,0,.6)':'')+'">'+c+'</div>';});h(ks);
  h('<div class="illus" style="left:150px;top:1272px">SKILL.md · YOUR CARD WILL DIFFER</div>');
  caption('Claude writes the skill file. A short name, and a description of what it does, and when.', 12);
}

if (S === 7) {
  tracker(4,'STEP<br>4 OF 4');
  h('<div class="eyebrow">// DOES IT PICK THE CARD?</div>');
  h('<div class="head">Test it in a <em>new chat.</em></div>');
  // chat strip (generic, illustrative)
  h('<div style="position:absolute;left:150px;top:420px;width:768px;height:272px;border-radius:16px;background:rgba(245,238,219,.96);box-shadow:0 16px 30px rgba(0,0,0,.5);color:#1d2230;padding:20px 24px">'
   +'<div style="font:700 17px \'Courier Prime\';letter-spacing:.16em;color:#8a7a5a">NEW CHAT · ILLUSTRATIVE</div>'
   +'<div style="margin-top:10px;margin-left:auto;width:max-content;max-width:560px;background:#20396b;color:#f3ead6;border-radius:16px 16px 4px 16px;padding:12px 18px;font:500 26px/1.3 Inter">Draft this week\'s update from these notes.</div>'
   +'<div style="margin-top:14px;display:flex;align-items:center;gap:12px;font:700 25px \'Courier Prime\';color:#20396b"><span style="width:26px;height:26px;border-radius:50%;border:4px solid #c9a04f;border-top-color:transparent;transform:rotate(40deg)"></span>Reading weekly-team-update…</div>'
   +'<div style="margin-top:10px;display:flex;gap:10px;align-items:center;font:500 23px Inter;color:#1d2230"><span style="background:#e7dcc0;border-radius:6px;padding:4px 10px">Wins</span><span style="background:#e7dcc0;border-radius:6px;padding:4px 10px">Blockers</span><span style="background:#e7dcc0;border-radius:6px;padding:4px 10px">Priorities</span><span style="margin-left:auto;font:700 22px \'Courier Prime\';color:#3e7a5a">✓ MATCHES YOUR EXAMPLE</span></div></div>');
  var k=520/1080, X=418, Y=722;
  h('<img src="../site/3d/cab_open.png" style="position:absolute;left:'+X+'px;top:'+Y+'px;width:520px;filter:drop-shadow(0 24px 30px rgba(0,0,0,.6))">');
  fetch('../site/3d/cab_open.json').then(function(r){return r.json();}).then(function(d){
    var pl=d.plates.filter(function(p){return p.c===1&&p.r===0;})[0], cd=d.plates.filter(function(p){return p.card;})[0];
    var tx=X+cd.x*k, ty=Y+cd.y*k, rx=X+pl.x*k, ry=Y+(pl.y+44)*k;
    // brass glow on the matched card
    h('<div style="position:absolute;left:'+(tx-60)+'px;top:'+(ty-40)+'px;width:120px;height:80px;border-radius:50%;background:radial-gradient(rgba(255,215,120,.55),transparent 70%)"></div>');
    // mocap librarian: CMU walk pose, right arm solved (2-bone IK) to the lifted card
    var P=RIG.sample('walk',0.35,{inplace:true});
    var sc=1.32, ox=372, oy=1262; // hip x -> ox, ground -> oy
    var T=[(rx-ox)/sc, -(ry-oy)/sc];
    function ik(S0,E0,H0,T){var l1=Math.hypot(E0[0]-S0[0],E0[1]-S0[1]),l2=Math.hypot(H0[0]-E0[0],H0[1]-E0[1]);var dx=T[0]-S0[0],dy=T[1]-S0[1],dd=Math.min(Math.hypot(dx,dy),l1+l2-1);var a=Math.atan2(dy,dx),b=Math.acos((l1*l1+dd*dd-l2*l2)/(2*l1*dd));var ea=a-b;var E=[S0[0]+l1*Math.cos(ea),S0[1]+l1*Math.sin(ea),E0[2]];var H=[E[0]+(dx-l1*Math.cos(ea))/Math.hypot(dx-l1*Math.cos(ea),dy-l1*Math.sin(ea))*l2,E[1]+(dy-l1*Math.sin(ea))/Math.hypot(dx-l1*Math.cos(ea),dy-l1*Math.sin(ea))*l2,H0[2]];return [E,H];}
    var r=ik(P.sR,P.eR,P.hR,T);P.eR=r[0];P.hR=r[1];
    var body=RIG.svg(P,'robot',{pal:{body:'#c9a04f',back:'#8a6a2c',edge:'#20396b',joint:'#20396b',inner:'#e8cf8a'}});
    h('<svg style="position:absolute;left:0;top:0;overflow:visible" width="1080" height="1920"><ellipse cx="'+ox+'" cy="'+(oy+4)+'" rx="120" ry="16" fill="rgba(0,0,0,.45)"/><g transform="translate('+ox+' '+oy+') scale('+sc+')">'+body+'</g></svg>');
  });
  h('<div class="chip" style="left:150px;top:1272px;background:var(--red);color:#fff4e6;box-shadow:0 6px 14px rgba(0,0,0,.4)">NOT PICKED UP? SHARPEN THE DESCRIPTION</div>');
  caption('Step four. Test it in a new chat. If Claude doesn\'t pick it up, sharpen the description.', 6);
}

if (S === 8) {
  tracker(5,'WHY IT<br>SCALES');
  h('<div class="eyebrow">// WHY DOZENS COST ALMOST NOTHING</div>');
  h('<div class="head">Until it\'s needed:<br><em>about 100 tokens.</em></div>');
  // the jar: tall glass "context window"; 24 label slivers at the bottom + one pulled card block
  var jx=360, jy=540, jw=380, jh=700;
  var s='<svg style="position:absolute;left:0;top:0" width="1080" height="1920"><defs>'
   +'<linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".18" stop-color="#fff" stop-opacity=".05"/><stop offset=".8" stop-color="#fff" stop-opacity=".03"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/></linearGradient>'
   +'<clipPath id="jc"><rect x="'+(jx+10)+'" y="'+(jy+60)+'" width="'+(jw-20)+'" height="'+(jh-70)+'" rx="34"/></clipPath></defs>';
  // lid (brass)
  s+='<rect x="'+(jx+20)+'" y="'+jy+'" width="'+(jw-40)+'" height="46" rx="10" fill="#b48a3c" stroke="#5b4419" stroke-width="3"/>';
  for(var i=0;i<14;i++) s+='<rect x="'+(jx+34+i*23)+'" y="'+(jy+6)+'" width="6" height="34" rx="3" fill="#8a6a2c" opacity=".7"/>';
  // contents: 24 thin strata (labels) + one card block
  var base=jy+jh-12, g='';
  var cols=['#c9a04f','#d8b25e','#b8913f'];
  for(var i=0;i<24;i++){g+='<rect x="'+(jx+10)+'" y="'+(base-(i+1)*1.6)+'" width="'+(jw-20)+'" height="1.6" fill="'+cols[i%3]+'"/>';}
  var cardTop=base-24*1.6-80;
  g+='<rect x="'+(jx+10)+'" y="'+cardTop+'" width="'+(jw-20)+'" height="80" fill="#f5eedb"/>';
  for(var i=0;i<3;i++) g+='<rect x="'+(jx+10)+'" y="'+(cardTop+18+i*20)+'" width="'+(jw-20)+'" height="2" fill="#7f9cc8" opacity=".5"/>';
  s+='<g clip-path="url(#jc)">'+g+'</g>';
  // glass body
  s+='<rect x="'+(jx+10)+'" y="'+(jy+60)+'" width="'+(jw-20)+'" height="'+(jh-70)+'" rx="34" fill="url(#gl)" stroke="rgba(230,240,255,.55)" stroke-width="4"/>';
  s+='<rect x="'+(jx+30)+'" y="'+(jy+90)+'" width="14" height="'+(jh-160)+'" rx="7" fill="#fff" opacity=".18"/>';
  for(var i=1;i<12;i++) s+='<rect x="'+(jx+jw-40-(i%2?0:14))+'" y="'+(jy+60+i*52)+'" width="'+(i%2?18:32)+'" height="3" fill="#e6eef8" opacity=".35"/>';
  // empty-space label inside the jar
  s+='<text x="'+(jx+jw/2)+'" y="'+(jy+330)+'" text-anchor="middle" font-family="Courier Prime" font-weight="700" font-size="26" letter-spacing="3" fill="#c9bfa8" opacity=".85">CONTEXT WINDOW</text>';
