<!doctype html><html><head><meta charset="utf-8"><title>Surya Tilak mockup</title>
<style>
@font-face{font-family:Rozha;src:url(../../../../assets/fonts/rozha-one/rozha-one-latin-400-normal.woff2);font-display:block}
@font-face{font-family:MM;font-weight:500;src:url(../../../../assets/fonts/martian-mono/martian-mono-latin-500-normal.woff2);font-display:block}
@font-face{font-family:Inter;font-weight:600;src:url(../../../../assets/fonts/inter/inter-latin-600-normal.woff2);font-display:block}
@font-face{font-family:Inter;font-weight:800;src:url(../../../../assets/fonts/inter/inter-latin-800-normal.woff2);font-display:block}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#120709}
#stage{position:absolute;inset:0;width:1080px;height:1920px}
canvas,svg{position:absolute;left:0;top:0}
#ov{position:absolute;inset:0;pointer-events:none}
.kick{position:absolute;left:162px;top:214px;font:500 22px MM;letter-spacing:.14em;color:#ffd9a0;text-transform:uppercase}
.kick i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#ffd9a0;margin-right:12px;box-shadow:0 0 14px #ffb347}
.head{position:absolute;left:162px;top:256px;width:756px;font:400 78px/1.06 Rozha;letter-spacing:-.01em;color:#f6ecd9;text-shadow:0 4px 16px rgba(0,0,0,.7),0 1px 3px rgba(0,0,0,.9)}
.head b{font-weight:400;color:#ffc56b}
.tag{position:absolute;font:600 24px/1.25 Inter;color:#f6ecd9;background:rgba(24,10,12,.82);border:1.5px solid rgba(255,217,160,.55);padding:9px 14px 10px;border-radius:3px;white-space:nowrap}
.tag small{display:block;font:500 16px MM;letter-spacing:.1em;color:#ffc56b;margin-bottom:3px;text-transform:uppercase}
.tag.v{border-color:#ff6a4a}.tag.v small{color:#ff8a6a}
.hud{position:absolute;left:162px;top:1196px;display:flex;gap:10px}
.hud div{font:500 19px MM;letter-spacing:.06em;color:#f6ecd9;background:rgba(24,10,12,.8);border:1.5px solid rgba(255,217,160,.35);padding:9px 12px;border-radius:3px}
.hud div small{display:block;font:500 13px MM;color:#c9a777;letter-spacing:.12em;margin-bottom:3px}
.src{position:absolute;left:162px;top:1276px;width:756px;font:500 16px MM;color:#c9a777;letter-spacing:.06em;text-transform:uppercase}
.cap{position:absolute;left:162px;top:1350px;width:756px;font:800 40px/1.25 Inter;color:#f1f3f8;text-shadow:0 2px 10px rgba(0,0,0,.9),0 1px 2px rgba(0,0,0,.95)}
.cap span{color:#ffc56b}
</style></head><body><div id="stage"><canvas id="gl" width="1080" height="1920"></canvas><svg id="lines" width="1080" height="1920"></svg><div id="ov"></div></div>
<script src="../../../../assets/animations/three/three-gltf-r160.min.js"></script>
<script>
Promise.all(['78px Rozha','500 20px MM','600 20px Inter','800 20px Inter'].map(function(f){return document.fonts.load(f)})).then(function(){var s=document.createElement('script');s.src='mock.js';document.body.appendChild(s);});
</script></body></html>
