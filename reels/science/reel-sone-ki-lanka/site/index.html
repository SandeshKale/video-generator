<!doctype html><html><head><meta charset="utf-8"><title>Sone ki Lanka</title><style>
@font-face{font-family:An;font-weight:700;src:url(fonts/antonio-latin-700-normal.woff2);font-display:block}
@font-face{font-family:RH;font-weight:500;src:url(fonts/red-hat-mono-latin-500-normal.woff2);font-display:block}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2);font-display:block}
@font-face{font-family:Inter;font-weight:800;src:url(fonts/inter-latin-800-normal.woff2);font-display:block}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#2a1a0c}
#stage{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden}canvas,svg{position:absolute;left:0;top:0}
#ov{position:absolute;inset:0;pointer-events:none}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 55%,rgba(20,10,4,.26) 100%)}
.scr{position:absolute;left:0;width:1080px}
#flash{position:absolute;inset:0;background:#fff3d0;opacity:0}
.kick{position:absolute;left:162px;top:206px;font:500 22px RH;letter-spacing:.16em;color:#f3e6c8;text-transform:uppercase;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.kick i{display:inline-block;width:12px;height:12px;background:#e7b53c;margin-right:12px;transform:rotate(45deg)}
.head{position:absolute;left:162px;top:246px;width:756px;font:700 84px/1.06 An;letter-spacing:-.01em;color:#fbf3df;text-transform:uppercase;text-shadow:0 4px 18px rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.8)}
.head b{font-weight:700;background:#e7b53c;color:#231405;padding:0 14px;text-shadow:none}
.tag{position:absolute;font:600 26px/1.25 Inter;color:#fbf3df;background:rgba(34,20,8,.88);border-left:4px solid #e7b53c;padding:10px 16px 11px;white-space:nowrap}
.tag small{display:block;font:500 15px RH;letter-spacing:.12em;color:#e7b53c;margin-bottom:3px;text-transform:uppercase}
.hud{position:absolute;left:162px;top:1196px;display:flex;gap:10px}
.hud div{font:500 22px RH;letter-spacing:.04em;color:#fbf3df;background:rgba(34,20,8,.88);border-left:4px solid #e7b53c;padding:9px 14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hud div small{display:block;font:500 13px RH;color:#e7b53c;letter-spacing:.12em;margin-bottom:3px}
.src{position:absolute;left:162px;top:1284px;width:756px;font:500 14px RH;color:#efe2c6;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;text-shadow:0 1px 4px #000}
#cap{position:absolute;left:162px;top:1340px;width:756px}
.fol{position:absolute;left:162px;top:1100px;height:92px;padding:0 26px 0 108px;display:flex;align-items:center;background:#0a0f1d;border:3px solid #b4f000;border-radius:8px;font:800 34px Inter;color:#eaffd0;white-space:nowrap}
.fol img{position:absolute;left:-14px;top:-14px;width:114px;height:114px;border-radius:50%;border:6px solid #b4f000;box-shadow:0 0 0 6px #0a0f1d}
.fol em{font-style:normal;color:#b4f000;margin-left:16px;font-size:26px;letter-spacing:.1em}
.endc{position:absolute;left:162px;top:560px;width:756px;text-align:center}
.endc img{width:240px;height:240px;border-radius:50%;border:8px solid #b4f000;box-shadow:0 0 0 10px #0a0f1d,0 16px 40px rgba(0,0,0,.7);display:block;margin:0 auto}
.endc .hn{font:700 92px An;color:#fbf3df;margin-top:26px;text-shadow:0 4px 16px rgba(0,0,0,.85)}
.endc .ser{font:500 22px RH;letter-spacing:.14em;color:#f3e6c8;margin-top:8px;text-transform:uppercase;text-shadow:0 2px 6px #000}
.endc .btns{margin-top:28px;display:flex;gap:20px;justify-content:center}
.endc .btns span{font:800 32px Inter;letter-spacing:.1em;padding:16px 34px;border-radius:999px;background:#b4f000;color:#0a0f1d;display:inline-block}
</style></head><body>
<div id="stage"><canvas id="gl" width="1080" height="1920"></canvas><div class="vig" data-ov="1"></div><div id="flash" data-ov="1"></div>
<div class="scr" data-ov="1" style="top:0;height:640px;background:linear-gradient(180deg,rgba(40,22,8,.66) 0,rgba(40,22,8,.32) 60%,rgba(40,22,8,0) 100%)"></div>
<div class="scr" data-ov="1" style="top:1180px;height:740px;background:linear-gradient(0deg,rgba(40,22,8,.9) 0,rgba(40,22,8,.6) 60%,rgba(40,22,8,0) 100%)"></div>
<svg id="lines" width="1080" height="1920"></svg><div id="ov"></div><div id="cap"></div></div>
<script src="lib/three-gltf-r160.min.js"></script><script src="lib/captions.js"></script><script src="timing.js"></script>
<script>
window.__ready=false;window.IM={};
var IMGS=['tex/aarfontein_sunrise.jpg','tex/red_brick_03_diff.jpg','tex/red_brick_03_nor.jpg','tex/red_brick_03_rough.jpg','tex/marble_01_diff.jpg','tex/marble_01_nor.jpg','tex/marble_01_rough.jpg','tex/white_sandstone_blocks_02_diff.jpg','tex/white_sandstone_blocks_02_nor.jpg','tex/white_sandstone_blocks_02_rough.jpg','tex/metal_plate_rough.jpg','film/lanka-28.jpg','profile.jpg'];
Promise.all(['700 84px An','500 20px RH','600 20px Inter','800 20px Inter'].map(function(f){return document.fonts.load(f)}).concat(IMGS.map(function(n){return new Promise(function(res){var i=new Image();i.onload=i.onerror=function(){res()};i.src='img/'+n;window.IM[n]=i;});}))).then(function(){var s=document.createElement('script');s.src='world.js';document.body.appendChild(s);});
</script></body></html>
