<!doctype html><html><head><meta charset="utf-8"><title>Gilli mockup</title><style>
@font-face{font-family:Brico;font-weight:800;src:url(fonts/bricolage-grotesque-latin-800-normal.woff2);font-display:block}
@font-face{font-family:PM;font-weight:500;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2);font-display:block}
@font-face{font-family:PM;font-weight:600;src:url(fonts/ibm-plex-mono-latin-600-normal.woff2);font-display:block}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2);font-display:block}
@font-face{font-family:Inter;font-weight:800;src:url(fonts/inter-latin-800-normal.woff2);font-display:block}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#F1E6D3}
#stage{position:absolute;inset:0}canvas{position:absolute;left:0;top:0}#ov{position:absolute;inset:0;pointer-events:none}
.head{position:absolute;left:162px;top:190px;width:756px;font:800 74px/1.02 Brico;letter-spacing:-.02em;color:#2A2118}
.head i{font-style:normal;background:#E8472A;color:#F1E6D3;padding:20px 16px 0;margin:0 -4px;display:inline-block;line-height:1}
.fig{position:absolute;left:162px;top:146px;font:500 22px PM;letter-spacing:.14em;color:#6b5d49;text-transform:uppercase}
.lbl{position:absolute;white-space:nowrap;font:600 30px Inter;color:#2A2118}
.lbl small{display:block;font:500 19px PM;letter-spacing:.12em;color:#6b5d49;text-transform:uppercase;margin-top:2px}
.dot{position:absolute;width:16px;height:16px;border-radius:50%;margin:-8px 0 0 -8px}
.ld{position:absolute;height:2px;background:#2A2118;transform-origin:0 0}
.big{position:absolute;font:800 120px/1 Brico;letter-spacing:-.03em;color:#2A2118}.big small{font:500 28px PM;letter-spacing:.1em;margin-left:10px;color:#6b5d49}
.cap{position:absolute;left:162px;top:1340px;width:756px}
.wipe{position:absolute;left:0;right:0;bottom:0;background:#2A2118;height:0}
.endc{position:absolute;left:150px;top:470px;width:780px;text-align:center;background:#1f1a14;border-radius:44px;padding:48px 30px 44px;box-shadow:0 30px 60px rgba(42,33,24,.35)}
.endc img{width:240px;height:240px;border-radius:50%;border:8px solid #b4f000;box-shadow:0 0 0 10px #1f1a14;display:block;margin:0 auto}
.endc .hn{font:800 88px Inter;color:#f1f3f8;margin-top:24px}
.endc .btns{margin-top:28px;display:flex;gap:22px;justify-content:center}
.endc .btns span{font:800 36px Inter;letter-spacing:.1em;padding:16px 40px;border-radius:999px;background:#b4f000;color:#1f1a14;display:inline-block}
.meter{position:absolute;left:162px;top:385px;width:420px;font:500 20px PM;letter-spacing:.12em;color:#6b5d49;text-transform:uppercase}.meter .tr{height:22px;background:#DCCDB4;border:2px solid #2A2118;margin-top:8px}.meter .bar{height:100%;background:#8F86C9;width:0}
.eq{position:absolute;left:162px;top:385px;font:800 120px/1 Brico;letter-spacing:-.03em;color:#2A2118}.eq b{font-weight:800}
