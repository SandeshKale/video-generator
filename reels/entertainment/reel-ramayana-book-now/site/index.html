<!doctype html><html><head><meta charset="utf-8"><title>Ramayana bookings</title><style>
@font-face{font-family:Bod;font-weight:800;src:url(fonts/bodoni-moda-latin-800-normal.woff2);font-display:block}
@font-face{font-family:CM;font-weight:500;src:url(fonts/chivo-mono-latin-500-normal.woff2);font-display:block}
@font-face{font-family:CM;font-weight:700;src:url(fonts/chivo-mono-latin-700-normal.woff2);font-display:block}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2);font-display:block}

:root{--bg:#0d1030;--gold:#ffb300;--kum:#e8341c;--lotus:#ff7aa8;--cream:#f6ecd5;--teal:#2ee6c0;--viol:#a58bff;--lime:#c6f432;--dim:#8f88a8;--ink:#0d1030}
*{box-sizing:border-box;margin:0}html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden}
body{position:relative;color:var(--cream);font-family:Inter}
#bg{position:absolute;inset:0}

#sweep{position:absolute;left:-400px;top:0;width:340px;height:1920px;background:linear-gradient(90deg,transparent,rgba(255,179,0,.12),transparent);transform:skewX(-14deg)}

.sc{position:absolute;inset:0;opacity:0;will-change:transform,opacity}
.eye{position:absolute;left:110px;top:150px;font:700 24px CM;letter-spacing:.14em;color:var(--gold)}

.h{position:absolute;left:110px;width:820px;top:196px;font:800 80px/1.04 Bod;letter-spacing:-.02em;text-shadow:0 4px 12px rgba(0,0,0,.5);text-transform:uppercase}
.h .k{background:var(--kum);color:var(--cream);padding:0 14px;text-shadow:none;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.h .g{background:var(--gold);color:var(--ink);padding:0 14px;text-shadow:none;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.lab{position:absolute;font:700 22px CM;letter-spacing:.08em;white-space:nowrap}

.tk{position:absolute;height:170px;border-radius:18px;background:var(--cream);color:var(--ink);box-shadow:0 18px 34px rgba(0,0,0,.55);overflow:hidden}

.tk:before,.tk:after{content:"";position:absolute;top:50%;width:34px;height:34px;margin-top:-17px;border-radius:50%;background:var(--bg)}.tk:before{left:-17px}.tk:after{right:-17px}

#caprule{position:absolute;left:110px;width:460px;top:1232px;border-top:4px dashed var(--gold)}

#dust{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;opacity:0;mix-blend-mode:screen;pointer-events:none}
#pet{position:absolute;left:0;top:0;pointer-events:none}
