<!doctype html><html><head><meta charset="utf-8"><title>Jailer 2 Hindi shows</title><style>
@font-face{font-family:Archivo;src:url(fonts/archivo-black-latin-400-normal.woff2);font-display:block}
@font-face{font-family:MM;font-weight:600;src:url(fonts/martian-mono-latin-600-normal.woff2);font-display:block}
@font-face{font-family:MM;font-weight:700;src:url(fonts/martian-mono-latin-700-normal.woff2);font-display:block}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2);font-display:block}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-latin-700-normal.woff2);font-display:block}
:root{--bg:#1a0c10;--paper:#f3e9d2;--hindi:#ff3d7f;--tamil:#2ee6d6;--telugu:#a58bff;--kannada:#c6f432;--ink:#1a0c10;--dim:#8a7378}
*{box-sizing:border-box;margin:0}html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden}
body{position:relative;color:var(--paper);font-family:Inter}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 45% at 50% 28%,#34141c 0,var(--bg) 72%)}
#seats{position:absolute;inset:-60px 0 -60px 0;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='56'><rect x='12' y='10' width='36' height='28' rx='9' fill='%23f3e9d2'/><rect x='6' y='30' width='48' height='14' rx='6' fill='%23f3e9d2'/></svg>")}
.sc{position:absolute;inset:0;opacity:0;will-change:transform,opacity}
.eye{position:absolute;left:120px;top:150px;font:700 26px MM;letter-spacing:.12em;color:var(--hindi)}
.eye i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--hindi);margin-right:12px;vertical-align:-1px}
.h{position:absolute;left:120px;width:840px;top:200px;font:400 84px/1.04 Archivo;text-transform:uppercase;letter-spacing:-.01em;text-shadow:0 4px 12px rgba(0,0,0,.5)}
.h .k{background:var(--hindi);color:var(--ink);padding:0 14px;text-shadow:none;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.lab{position:absolute;font:700 24px MM;letter-spacing:.06em;white-space:nowrap}
.src{position:absolute;left:120px;width:840px;font:600 18px/1.35 MM;color:var(--dim);letter-spacing:.04em}
.chip{position:absolute;border:3px solid var(--paper);padding:10px 16px;font:700 24px/1.2 MM;background:rgba(26,12,16,.88);white-space:nowrap}
.stamp{position:absolute;font:400 110px/1 Archivo;border:8px solid var(--hindi);color:var(--hindi);padding:4px 24px;white-space:nowrap;text-transform:uppercase}
#av{position:absolute;left:610px;top:1215px;width:300px;height:300px;-webkit-mask-image:radial-gradient(ellipse 50% 52% at 50% 46%,#000 60%,transparent 100%);mask-image:radial-gradient(ellipse 50% 52% at 50% 46%,#000 60%,transparent 100%)}
#av canvas{width:300px;height:300px}
#cap{position:absolute;left:120px;top:1250px;width:470px;min-height:130px;background:rgba(0,0,0,.72);border-left:8px solid var(--hindi);padding:14px 18px;font:700 32px/1.28 Inter;color:var(--paper)}
#caprule{position:absolute;left:120px;width:470px;top:1232px;border-top:4px dashed var(--hindi)}
#dust{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;opacity:0;mix-blend-mode:screen;pointer-events:none}
</style></head><body><div id="bg"></div><div id="seats"></div><div id="scenes"></div><video id="dust" muted preload="auto" src="dust-particles.webm"></video><div id="caprule"></div><div id="cap"></div><div id="av"><canvas id="avc" width="380" height="380"></canvas></div>
<script src="vendor/rough.min.js"></script><script src="timing.js"></script><script src="app.js"></script></body></html>
