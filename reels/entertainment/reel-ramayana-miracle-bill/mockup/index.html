<!doctype html><html><head><meta charset="utf-8"><title>VFX ka bill — mockup</title>
<style>
@font-face{font-family:IntT;font-weight:200;src:url(fonts/inter-latin-200-normal.woff2);font-display:block}
@font-face{font-family:IntT;font-weight:300;src:url(fonts/inter-latin-300-normal.woff2);font-display:block}
@font-face{font-family:IntT;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2);font-display:block}
@font-face{font-family:JBM;font-weight:300;src:url(fonts/jetbrains-mono-latin-300-normal.woff2);font-display:block}
@font-face{font-family:JBM;font-weight:500;src:url(fonts/jetbrains-mono-latin-500-normal.woff2);font-display:block}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden;background:#000}
canvas{position:absolute;left:0;top:0}#ov{position:absolute;inset:0;pointer-events:none}
.lb{position:absolute;color:#cfe6f2;white-space:nowrap}
.lb .in{background:rgba(0,0,0,.55);padding:10px 14px 8px;border-radius:4px}
.lb .bar{position:absolute;top:0;bottom:0;width:2px;background:#e8f6ff;box-shadow:0 0 10px #bfe6ff}
.tag{font:500 23px/1.2 JBM;letter-spacing:.16em;text-transform:uppercase;color:#a9d8f0}
.big{font:200 84px/1 IntT;letter-spacing:-.02em;color:#eef6fb;margin:6px 0 4px}.big small{font:300 30px IntT;letter-spacing:.06em;margin-left:10px;color:#a9d8f0}
.big.em{color:#ffc27a}.big.em small{color:#ffc27a}
.src{font:300 20px/1.3 JBM;letter-spacing:.1em;text-transform:uppercase;color:#8fa6b4}
.title{position:absolute;left:162px;top:150px;font:200 64px/1 IntT;letter-spacing:-.02em;color:#eef6fb}.title b{font-weight:300;color:#ffc27a}
.cap{position:absolute;left:162px;width:756px;top:1360px;font:600 40px/1.25 IntT;color:#f1f3f8;text-shadow:0 3px 14px rgba(0,0,0,.9);text-align:left}
.cap i{font-style:normal;color:#ffc27a}
.wipe{position:absolute;top:0;bottom:0;width:2px;background:#f2fbff;box-shadow:0 0 18px 3px #bfe6ff}
</style></head><body>
<div id="stage"><canvas id="gl" width="1080" height="1920"></canvas><div id="ov"></div></div>
<script src="lib/three-gltf-r160.min.js"></script>
<script src="world.js"></script>
</body></html>
