<!doctype html><html><head><meta charset="utf-8"><title>Ramayana trailer review</title><style>
@font-face{font-family:Anton;src:url(fonts/anton-latin-400-normal.woff2);font-display:block}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2);font-display:block}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-latin-700-normal.woff2);font-display:block}
@font-face{font-family:JB;font-weight:700;src:url(fonts/jetbrains-mono-latin-700-normal.woff2);font-display:block}
*{box-sizing:border-box;margin:0}html,body{width:1080px;height:1920px;background:#12100d;overflow:hidden}
body{position:relative;color:#f3ecdc;font-family:Inter}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 30%,#2a2013 0,#12100d 70%)}
.perf{position:absolute;left:0;right:0;height:34px;background:repeating-linear-gradient(90deg,#12100d 0 22px,#2a251c 22px 44px)}
.ember{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffb703;box-shadow:0 0 12px 3px rgba(255,120,30,.7)}
.sc{position:absolute;inset:0;opacity:0;will-change:transform,opacity}
.eye{position:absolute;left:120px;top:150px;font:700 28px JB;letter-spacing:.14em;color:#ffb703}
.h{position:absolute;left:120px;right:120px;top:205px;font:400 96px/1.02 Anton;text-transform:uppercase;letter-spacing:.01em;text-shadow:0 4px 12px rgba(0,0,0,.55)}
.h b{color:#ff4d2e;font-weight:400}
.fr{position:absolute;left:0;top:450px;width:1080px;height:608px;overflow:hidden;border-top:6px solid #ffb703;border-bottom:6px solid #ffb703;background:#000}
.fr img{position:absolute;left:-60px;top:-40px;width:1200px;height:688px;object-fit:cover;transform-origin:50% 50%}
.fr .vig{position:absolute;inset:0;background:radial-gradient(ellipse 80% 80% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
.fr .sweep{position:absolute;top:0;bottom:0;width:240px;background:linear-gradient(90deg,transparent,rgba(255,220,150,.22),transparent);transform:skewX(-18deg)}
.fr svg{position:absolute;inset:0;width:1080px;height:608px}
.lab{position:absolute;font:700 26px JB;background:#ff4d2e;color:#12100d;padding:8px 14px;letter-spacing:.04em;white-space:nowrap}
.stat{position:absolute;left:120px;top:1060px;font:400 120px/1 Anton;color:#ffb703;white-space:nowrap}
.stat small{font:700 28px JB;color:#eee6d3;margin-left:18px;letter-spacing:.04em}
.chips{position:absolute;left:120px;display:flex;gap:14px;flex-wrap:wrap;width:840px}
.chip{border:3px solid #ffb703;padding:10px 16px;font:700 26px/1.2 JB;background:rgba(18,16,13,.85);white-space:nowrap}.chip.r{border-color:#ff4d2e}
.col{position:absolute;top:470px;width:470px;height:380px;padding:26px;border:4px solid #ffb703;background:rgba(18,16,13,.88)}
.col h3{font:400 56px/1 Anton;margin-bottom:18px}.col p{font:700 30px/1.3 Inter;margin:0 0 16px;color:#eee6d3}
.stamp{position:absolute;font:400 150px/1 Anton;color:#ff4d2e;border:10px solid #ff4d2e;padding:6px 26px;letter-spacing:.02em;white-space:nowrap}
#av{position:absolute;left:600px;top:1215px;width:310px;height:310px;-webkit-mask-image:radial-gradient(ellipse 50% 52% at 50% 46%,#000 60%,transparent 100%);mask-image:radial-gradient(ellipse 50% 52% at 50% 46%,#000 60%,transparent 100%)}
#av canvas{width:310px;height:310px}
#cap{position:absolute;left:120px;top:1250px;width:470px;min-height:150px;background:rgba(0,0,0,.72);border-left:8px solid #ffb703;padding:16px 20px;font:700 34px/1.28 Inter;color:#f3ecdc}
#scan{position:absolute;top:450px;height:760px;width:300px;background:linear-gradient(90deg,transparent,rgba(255,200,120,.17),transparent);transform:skewX(-16deg);mix-blend-mode:screen;pointer-events:none;z-index:5}
#caprule{position:absolute;left:120px;width:470px;top:1232px;border-top:4px dashed #ff4d2e}
.src{position:absolute;left:120px;right:120px;font:700 20px/1.4 JB;color:#9a917c;letter-spacing:.04em}
</style></head><body><div id="bg"></div><div class="perf" style="top:40px"></div><div class="perf" style="bottom:40px"></div><div id="embers"></div><div id="scan"></div><div id="scenes"></div><div id="caprule"></div><div id="cap"></div><div id="av"><canvas id="avc" width="544" height="544"></canvas></div>
<script src="timing.js"></script><script src="app.js"></script></body></html>
