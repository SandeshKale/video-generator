<!doctype html><html><head><meta charset="utf-8"><title>IPL swap</title><style>
@font-face{font-family:Teko;font-weight:700;src:url(fonts/teko-devanagari-700-normal.woff2);font-display:block;unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF}
@font-face{font-family:Teko;font-weight:700;src:url(fonts/teko-latin-700-normal.woff2);font-display:block}
@font-face{font-family:Teko;font-weight:600;src:url(fonts/teko-latin-600-normal.woff2);font-display:block}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2);font-display:block}
@font-face{font-family:Inter;font-weight:800;src:url(fonts/inter-latin-800-normal.woff2);font-display:block}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#0c0f14}
#stage{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden;background:#0c0f14}
#bg{position:absolute;inset:0}canvas{position:absolute;left:0;top:0}#ov{position:absolute;inset:0;pointer-events:none}
#flash{position:absolute;inset:0;background:#f4f1e8;opacity:0}
.slam{position:absolute;left:162px;width:756px;font:700 112px/.98 Teko;color:#f4f1e8;text-shadow:0 6px 24px rgba(0,0,0,.6);letter-spacing:-.5px}
.slam i{font-style:normal;display:inline-block;padding:0 14px;background:#f5b82e;color:#10131a;text-shadow:none}
.num{position:absolute;font:700 190px/.9 Teko;font-variant-numeric:tabular-nums;color:#f4f1e8;text-shadow:0 6px 24px rgba(0,0,0,.6);white-space:nowrap}
.num small{font:600 38px Teko;letter-spacing:.14em;margin-left:12px;color:#c9c5ba}
.card{position:absolute;overflow:hidden;border-radius:6px;box-shadow:0 20px 50px rgba(0,0,0,.65)}
.card img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.card .cr{position:absolute;left:8px;bottom:8px;font:600 13px Inter;letter-spacing:.06em;color:#f4f1e8;background:rgba(10,12,16,.82);padding:4px 8px;border-radius:3px}
.chip{position:absolute;font:700 40px/1 Teko;letter-spacing:.08em;color:#fff;padding:8px 18px 4px;white-space:nowrap}
.tag{position:absolute;left:162px;top:1292px;font:600 15px Inter;letter-spacing:.12em;color:#c9c5ba;text-transform:uppercase;white-space:nowrap}
.cap{position:absolute;left:162px;top:1340px;width:756px;font:800 40px/1.25 Inter;color:#eef0f4;text-shadow:0 2px 10px rgba(0,0,0,.85)}
.cap b{color:#f5b82e;font-weight:800}
.stat{position:absolute;font:700 150px/.9 Teko;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat small{display:block;font:600 34px/1.1 Teko;letter-spacing:.1em;color:#c9c5ba;margin-top:6px}
div.seat{position:absolute;opacity:0}
.led{position:absolute;background:#141720;border:2px solid rgba(244,241,232,.16);border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,.6);background-image:repeating-linear-gradient(0deg,transparent 0 53px,rgba(244,241,232,.05) 53px 54px)}
.led h4{position:absolute;left:24px;top:18px;font:600 30px Teko;letter-spacing:.14em;color:#c9c5ba;text-transform:uppercase}
.big{position:absolute;font:700 220px/.9 Teko;font-variant-numeric:tabular-nums;white-space:nowrap}
.big small{font:600 40px Teko;letter-spacing:.12em;color:#c9c5ba;margin-left:10px}
.lab{position:absolute;font:600 32px/1.15 Teko;letter-spacing:.08em;color:#e7e3d8;white-space:nowrap}
.bar{position:absolute;bottom:0;border-radius:6px 6px 0 0}
.ov{position:absolute;width:56px;height:56px;border:3px solid rgba(244,241,232,.22);border-radius:8px}
.day{position:absolute;width:96px;height:68px;font:600 40px/68px Teko;text-align:center;color:#c9c5ba}
.endc{position:absolute;left:162px;top:520px;width:756px;text-align:center}
.endc img{width:240px;height:240px;border-radius:50%;border:8px solid #b4f000;box-shadow:0 0 0 10px #0a0f1d,0 16px 40px rgba(0,0,0,.7);display:block;margin:0 auto}
.endc .hn{font:800 88px Inter;color:#f4f1e8;margin-top:24px;text-shadow:0 4px 16px rgba(0,0,0,.85)}
.endc .btns{margin-top:28px;display:flex;gap:22px;justify-content:center}
.endc .btns span{font:800 36px Inter;letter-spacing:.1em;padding:16px 40px;border-radius:999px;background:#b4f000;color:#0a0f1d;display:inline-block}
svg.m{position:absolute;left:0;top:0;width:1080px;height:1920px}
</style></head><body>
<div id="stage" data-stage="1"><div id="bg"></div><canvas id="gl" width="1080" height="1920"></canvas><div id="ov"></div><div id="flash"></div></div>
<script src="lib/three-gltf-r160.min.js"></script><script src="lib/captions.js"></script><script src="timing.js"></script><script src="world.js"></script>
</body></html>
