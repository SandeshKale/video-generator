<!doctype html><html><head><meta charset="utf-8"><title>GTA6 map mockup</title><style>
@font-face{font-family:Man;font-weight:800;src:url(fonts/manrope-latin-800-normal.woff2);font-display:block}

.src{position:absolute;left:162px;top:1290px;font:500 19px Az;letter-spacing:.1em;color:#8fb4c4;text-transform:uppercase}
