<!doctype html><meta charset="utf-8"><title>NavIC v4 mockup</title>
<style>
@font-face{font-family:'Big Shoulders Display';font-weight:800;src:url('fonts/bigshoulders-800.woff2');font-display:block}
@font-face{font-family:'IBM Plex Mono';font-weight:600;src:url('fonts/plexmono-600.woff2');font-display:block}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('fonts/plexmono-700.woff2');font-display:block}
@font-face{font-family:'Inter';font-weight:800;src:url('fonts/inter-800.woff2');font-display:block}
:root{--bg:#031417;--amb:#ffb020;--sky:#55b8ff;--red:#ff4a3d;--ivo:#f4efe3}
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Inter,sans-serif;color:var(--ivo)}
#gl{position:absolute;left:0;top:0;width:1080px;height:1920px}
.ov{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.mono{position:absolute;font:700 24px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.big{position:absolute;font:800 170px/.88 'Big Shoulders Display',sans-serif;text-transform:uppercase;color:var(--ivo);text-shadow:0 6px 30px rgba(0,0,0,.75);white-space:nowrap}
.tag{position:absolute;padding:9px 18px;border:3px solid currentColor;background:rgba(3,20,23,.86);white-space:nowrap;font:700 22px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.card{position:absolute;left:290px;width:500px;box-sizing:border-box;padding:14px 22px 16px;border:3px solid var(--amb);background:rgba(3,20,23,.9);text-align:center;border-radius:6px}
.card .k{font:700 15px 'IBM Plex Mono';letter-spacing:.22em;color:var(--amb);text-transform:uppercase}
.card .t{font:800 46px/1.05 'Big Shoulders Display';color:var(--ivo);text-transform:uppercase;margin-top:4px}
.card .s{font:700 18px 'IBM Plex Mono';letter-spacing:.06em;color:rgba(244,239,227,.8);margin-top:4px}
.ask{position:absolute;left:150px;width:768px;box-sizing:border-box;padding:16px 24px;border:3px solid #ffb020;background:rgba(3,20,23,.9);border-radius:10px;font:800 40px/1.15 Inter,sans-serif;color:#f4efe3;letter-spacing:-.01em}
.scope{position:absolute;background:rgba(3,20,23,.88);border:3px solid rgba(85,184,255,.6);padding:16px 24px;box-sizing:border-box;clip-path:polygon(0 18px,18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px))}
#cap{position:absolute;z-index:20;left:150px;width:768px;top:1338px;text-align:center}
#flash{position:absolute;z-index:21;inset:0;pointer-events:none;opacity:0}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 52%,rgba(0,0,0,.55) 100%)}
</style>
<div id="stage"><canvas id="gl" width="1080" height="1920"></canvas><div id="vig"></div><div class="ov" id="ov"></div><div id="cap"></div><div id="flash"></div></div>
<script src="three.min.js"></script><script src="timing.js"></script><script src="captions.js"></script><script src="icons.js"></script><script src="mock.js"></script>
