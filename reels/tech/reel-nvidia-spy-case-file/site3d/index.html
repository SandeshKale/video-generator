<!doctype html><meta charset="utf-8"><title>Sabke paas bayaan hain, saboot nahi</title>
<style>
@font-face{font-family:'Alfa Slab One';font-weight:400;src:url('fonts/alfa-400.woff2');font-display:block}
@font-face{font-family:'JetBrains Mono';font-weight:700;src:url('fonts/jbmono-700.woff2');font-display:block}
@font-face{font-family:'Inter';font-weight:600;src:url('fonts/inter-600.woff2');font-display:block}
@font-face{font-family:'Inter';font-weight:800;src:url('fonts/inter-800.woff2');font-display:block}
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#cdb98c;font-family:Inter,sans-serif;color:#13172a}
#gl{position:absolute;left:0;top:0;width:1080px;height:1920px}
.ov{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.ov>div{position:absolute}
#cap{position:absolute;z-index:20;left:150px;width:768px;top:1338px;text-align:center}
#flash{position:absolute;z-index:21;inset:0;pointer-events:none;opacity:0}
</style>
<div id="stage"><canvas id="gl" width="1080" height="1920"></canvas><div class="ov" id="ov"></div><div id="cap"></div><div id="flash"></div></div>
<script>window.__ready=false;</script><script src="three.min.js"></script><script src="timing.js"></script><script src="captions.js"></script><script src="icons.js"></script>
<script>Promise.all(['400 40px "Alfa Slab One"','600 30px Inter','800 30px Inter','700 30px "JetBrains Mono"'].map(function(f){return document.fonts.load(f)})).then(function(){var s=document.createElement('script');s.src='world.js';document.body.appendChild(s)})</script>
