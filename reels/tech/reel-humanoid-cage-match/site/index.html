<!doctype html><html><head><meta charset="utf8"><title>The robot didn't fight</title><style>
@font-face{font-family:An;src:url('anton-latin-400-normal.woff2');font-display:block}
@font-face{font-family:BC;font-weight:800;src:url('barlow-condensed-latin-800-normal.woff2');font-display:block}
@font-face{font-family:BC;font-weight:600;src:url('barlow-condensed-latin-600-normal.woff2');font-display:block}
@font-face{font-family:IN;font-weight:600;src:url('inter-latin-600-normal.woff2');font-display:block}
:root{--cream:#f6efe2;--blue:#2b3bff;--coral:#ff5a36;--yel:#ffd23f;--ink:#14123a}
*{box-sizing:border-box;margin:0}html,body{width:1080px;height:1920px;overflow:hidden;background:var(--cream)}
#st{position:absolute;inset:0;overflow:hidden;font-family:IN;color:var(--blue)}
.a{position:absolute}.mx{mix-blend-mode:multiply}
.ht1,.ht2{position:absolute;inset:-20px}
.ht1{background-image:radial-gradient(#2b3bff2e 2.2px,transparent 2.6px);background-size:22px 22px}
.ht2{background-image:radial-gradient(#ff5a362e 2.2px,transparent 2.6px);background-size:22px 22px}
.eb{position:absolute;left:150px;top:150px;font:800 34px BC;letter-spacing:.14em;color:var(--blue);border:4px solid var(--blue);padding:6px 16px;white-space:nowrap}
.big{position:absolute;font:400 150px/.92 An;text-transform:uppercase;white-space:nowrap}
.stub{position:absolute;background:var(--yel);border:4px solid var(--ink);color:var(--ink);font:800 32px BC;letter-spacing:.06em;padding:10px 22px;white-space:nowrap}
.stamp{position:absolute;border:10px solid var(--coral);color:var(--coral);font:800 74px/1 BC;padding:6px 26px;letter-spacing:.04em;mix-blend-mode:multiply;white-space:nowrap}
.cap{position:absolute;left:90px;right:90px;top:1310px;min-height:100px;text-align:center;font:800 58px/1.04 BC;color:var(--cream);background:var(--ink);padding:14px 24px;border-radius:14px;box-shadow:8px 8px 0 var(--blue)}
.cap b{color:var(--yel);font-weight:800}
video{position:absolute;display:block}
.sc{position:absolute;inset:0}
#cv{position:absolute;left:0;top:0}
</style></head><body><div id="st"></div><script src="timing.js"></script><script src="mocap.js"></script><script src="rig.js"></script><script src="app.js"></script></body></html>
