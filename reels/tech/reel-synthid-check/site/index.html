<!doctype html>
<html><head><meta charset="utf-8"><title>SynthID check</title>
<style>
@font-face{font-family:Bodoni;font-weight:700;src:url(fonts/bodoni-moda-latin-700-normal.woff2);font-display:block}
@font-face{font-family:Bodoni;font-weight:800;src:url(fonts/bodoni-moda-latin-800-normal.woff2);font-display:block}
@font-face{font-family:Chivo;font-weight:500;src:url(fonts/chivo-mono-latin-500-normal.woff2);font-display:block}
@font-face{font-family:Chivo;font-weight:700;src:url(fonts/chivo-mono-latin-700-normal.woff2);font-display:block}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2);font-display:block}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-latin-700-normal.woff2);font-display:block}
:root{--cream:#f2ead3;--paper:#faf4e0;--ink:#13243d;--ink2:#46556b;--green:#0e6b5a;--verm:#e2412c;--brass:#c9962b;--thread:#7fb2c9;--line:#d8cca8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--cream)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif;color:var(--ink)}
#bg{position:absolute;left:0;top:0;width:1080px;height:1920px}
.scene{position:absolute;inset:0;display:none}
.abs{position:absolute}
.eyebrow{font-family:Chivo;font-weight:700;font-size:27px;letter-spacing:.13em;color:var(--green)}
.h1{font-family:Bodoni;font-weight:800;font-size:92px;line-height:1.02;letter-spacing:-.025em;color:var(--ink)}
.h1 .hl{color:var(--verm)}
.tag{font-family:Chivo;font-weight:700;font-size:16px;letter-spacing:.12em;color:var(--ink);background:rgba(250,244,224,.94);border:2px solid var(--ink);padding:3px 9px;border-radius:5px}
/* banknote cards: security thread on the left, double rule, serial label */
.note{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 0 0 7px var(--paper),0 0 0 10px var(--ink),0 22px 40px rgba(19,36,61,.28);overflow:hidden}
.thread{position:absolute;left:18px;top:0;bottom:0;width:12px;background:repeating-linear-gradient(180deg,var(--thread) 0 14px,transparent 14px 20px);opacity:.75}
.serial{font-family:Chivo;font-weight:700;font-size:15px;letter-spacing:.2em;color:var(--green)}
/* stamps: double border, rotated, ink-pad red or green */
.stamp{display:inline-block;font-family:Chivo;font-weight:700;letter-spacing:.08em;text-align:center;line-height:1.1;padding:12px 20px;border:6px double currentColor;border-radius:12px;background:rgba(250,244,224,.9);mix-blend-mode:normal}
.stamp small{display:block;font-size:14px;letter-spacing:.2em;margin-top:6px;opacity:.8}
.stamp.found{color:var(--green)}.stamp.none{color:var(--verm)}
/* phone */
.phone{background:#0d1522;border:5px solid var(--ink);border-radius:46px;padding:12px;box-shadow:0 30px 50px rgba(19,36,61,.4)}
.phone canvas{display:block;border-radius:34px}
.ctr{font-family:Chivo;font-weight:700;font-size:26px;color:#f7f1de;background:rgba(10,15,25,.62);border-radius:20px;padding:6px 14px;display:flex;align-items:center;gap:8px}
.play{width:104px;height:104px;border-radius:50%;background:rgba(250,244,224,.88);display:flex;align-items:center;justify-content:center;color:var(--ink)}
/* lightbox scene */
.chipn{font-family:Bodoni;font-weight:800;font-size:46px;color:var(--ink)}
.cardlab{font-family:Chivo;font-weight:700;font-size:21px;letter-spacing:.1em;line-height:1.25;color:var(--ink)}
.pcard{background:var(--paper);border:3px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 0 0 6px var(--paper),0 0 0 9px var(--ink),0 22px 36px rgba(19,36,61,.3)}
.pcard img{display:block;width:100%;height:100%;object-fit:cover}
.eq{width:84px;height:84px;border-radius:50%;background:var(--ink);color:var(--cream);font-family:Bodoni;font-weight:800;font-size:64px;display:flex;align-items:center;justify-content:center;border:5px solid var(--paper);box-shadow:0 10px 20px rgba(19,36,61,.35)}

.scene.dk{color:#f2ead3}
.scene.dk .h1{color:#f2ead3}.scene.dk .eyebrow{color:#e9b84a}.scene.dk .cardlab{color:#f2ead3}
.h1.big{font-size:128px;line-height:1;letter-spacing:-.03em;color:#f6efdc;text-shadow:0 6px 22px rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.8)}
.blk{display:inline-block;background:var(--verm);color:#f6efdc;padding:2px 20px 8px;margin-top:6px;border-radius:6px;transform:rotate(-2deg);text-shadow:none;box-shadow:0 10px 26px rgba(0,0,0,.45)}
.vig{background:linear-gradient(180deg,rgba(8,14,26,.82) 0,rgba(8,14,26,.35) 26%,rgba(8,14,26,0) 44%,rgba(8,14,26,0) 62%,rgba(8,14,26,.72) 100%)}
.hl{text-shadow:none}
.trk{display:flex;gap:10px;font-family:Chivo;font-weight:700;font-size:20px;letter-spacing:.1em}
.trk div{padding:5px 14px;border:2px solid var(--ink);border-radius:8px;background:rgba(250,244,224,.9);color:var(--ink2)}
.trk div.on{background:var(--verm);border-color:var(--verm);color:#f6efdc}
.trk div.done{background:var(--green);border-color:var(--green);color:#f6efdc}
.trk.dk div{background:rgba(15,29,51,.9);border-color:#7fb2c9;color:#9fb6c9}
.trk.dk div.on{background:var(--verm);border-color:var(--verm);color:#f6efdc}.trk.dk div.done{background:var(--green);border-color:var(--green);color:#f6efdc}
.urlbar{display:flex;align-items:center;gap:12px;height:76px;padding:0 22px;border-bottom:3px solid var(--ink);background:#e8dec0;font-family:Chivo;font-weight:700;font-size:32px;color:var(--ink)}
.urlbar .u{flex:1;background:var(--paper);border:2px solid var(--ink);border-radius:30px;padding:6px 20px;height:48px;white-space:nowrap}
.sbtn{display:flex;align-items:center;gap:16px;height:84px;padding:0 26px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);font-family:Inter;font-weight:700;font-size:30px;color:var(--ink);box-shadow:0 5px 0 var(--ink)}
.sbtn img{width:40px;height:40px}
.dz{border-radius:18px;background:rgba(250,244,224,.55)}
.tile{width:200px;height:200px;border-radius:16px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 0 0 6px var(--paper),0 0 0 9px var(--ink),0 18px 28px rgba(19,36,61,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink)}
.tile b{font-family:Chivo;font-size:22px;letter-spacing:.12em}
.chipr{font-family:Chivo;font-weight:700;font-size:25px;letter-spacing:.08em;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:10px 18px;box-shadow:0 5px 0 var(--ink)}
.chipr small{color:var(--verm);margin-right:10px;font-size:17px}
.prt{display:flex;align-items:center;gap:14px;height:78px;padding:0 20px;border:3px solid #7fb2c9;border-radius:12px;background:rgba(15,29,51,.85);font-family:Chivo;font-weight:700;font-size:28px;letter-spacing:.08em;color:#9fb6c9}
.prt img,.prt svg{width:38px;height:38px}
.prt.on{background:#f2ead3;border-color:#e9b84a;color:#13243d;box-shadow:0 0 30px rgba(233,184,74,.55)}
.prt.dim{opacity:.55;border-style:dashed}
.evc{display:flex;align-items:center;gap:20px;padding:0 28px 0 52px;font-family:Bodoni;font-weight:800;font-size:40px;line-height:1.05;color:var(--ink)}
.evc .ico{width:70px;height:70px;border-radius:50%;background:var(--ink);color:var(--cream);display:flex;align-items:center;justify-content:center;flex:none}
.evc small{display:block;font-family:Chivo;font-size:17px;letter-spacing:.16em;color:var(--green);margin-bottom:6px}
.recap{padding:22px 30px 22px 56px}
.recap .rh{font-family:Chivo;font-weight:700;font-size:24px;letter-spacing:.14em;color:var(--green);margin-bottom:12px}
.recap .rr{display:flex;gap:16px;align-items:center;font-family:Bodoni;font-weight:800;font-size:40px;line-height:1.5}
.recap .rr b{width:42px;height:42px;border-radius:50%;background:var(--verm);color:#f6efdc;font-family:Chivo;font-size:24px;display:flex;align-items:center;justify-content:center;flex:none}
.pfp{width:250px;height:250px;border-radius:50%;border:8px solid var(--ink);box-shadow:0 0 0 7px var(--brass),0 18px 34px rgba(19,36,61,.4);object-fit:cover}
.who{font-family:Bodoni;font-weight:800;font-size:60px;letter-spacing:-.01em;color:var(--ink)}
.cbub{display:flex;align-items:center;gap:14px;background:var(--ink);color:#f6efdc;border-radius:34px 34px 34px 8px;padding:14px 34px;font-family:Inter;font-weight:700;font-size:48px;box-shadow:0 14px 26px rgba(19,36,61,.35)}
.cbub .kw{color:#e9b84a;font-family:Chivo;letter-spacing:.1em}
.dm{font-family:Chivo;font-weight:700;font-size:30px;letter-spacing:.06em;color:var(--green)}
.fxv{mix-blend-mode:screen}
.flash{background:#fff4d6;pointer-events:none}
#cutc{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none;z-index:50}
#cap{position:absolute;left:150px;width:768px;top:1338px;display:flex;justify-content:center;z-index:60}
#cap div{background:rgba(19,36,61,.94);border:2px solid rgba(201,150,43,.6);color:#f2ead3;border-radius:22px;padding:14px 26px;font-family:Inter;font-weight:700;font-size:46px;line-height:1.25;text-align:center;max-width:768px;box-shadow:0 10px 30px rgba(19,36,61,.35)}
#cap span{opacity:.55}#cap span.on{opacity:1;color:#e9b84a}#cap span.past{opacity:1}
</style></head>
<body><div id="stage"><canvas id="bg" width="1080" height="1920"></canvas></div>
<canvas id="cutc" width="1080" height="1920"></canvas>
<script src="rough.min.js"></script>
<script src="marks.js"></script>
<script src="timing.js"></script>
<script src="app.js"></script>
</body></html>
