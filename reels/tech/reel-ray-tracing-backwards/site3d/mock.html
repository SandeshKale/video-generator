<!doctype html><meta charset="utf-8"><title>Ray tracing mockup</title>
<style>
@font-face{font-family:'Instrument Serif';font-weight:400;src:url('fonts/instrument.woff2');font-display:block}

@font-face{font-family:'Inter';font-weight:600;src:url('fonts/inter-600.woff2');font-display:block}

html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#07080b;font-family:Inter,sans-serif;color:#eef2ee}

#hdr{position:absolute;left:150px;top:150px;width:780px}

#cap{position:absolute;left:150px;width:768px;top:1338px;text-align:center;font:800 46px/1.18 Inter;text-shadow:0 3px 14px rgba(0,0,0,.9)}
#cap span{background:rgba(7,8,11,.78);padding:4px 14px;border-radius:8px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
#cap em{font-style:normal;color:#ffc46b}
#src{position:absolute;left:150px;top:1296px;width:768px;font:600 21px 'Martian Mono';letter-spacing:.06em;color:rgba(238,242,238,.62);text-shadow:0 2px 8px #000}
