<!doctype html><meta charset="utf-8"><title>Loan ne aapko dhoondha</title>
<style>
@font-face{font-family:'Chakra Petch';font-weight:700;src:url('fonts/chakra-700.woff2');font-display:block}

<script>window.__ready=false;</script><script src="three.min.js"></script><script src="timing.js"></script><script src="captions.js"></script><script src="icons.js"></script>
