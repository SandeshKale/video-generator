<!doctype html><html><head><meta charset="utf-8"><title>UPI chai journey</title><style>
@font-face{font-family:BS;font-weight:800;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format('woff2');font-display:block}
@font-face{font-family:BS;font-weight:600;src:url(fonts/big-shoulders-display-latin-600-normal.woff2) format('woff2');font-display:block}
@font-face{font-family:DM;font-weight:500;src:url(fonts/dm-mono-latin-500-normal.woff2) format('woff2');font-display:block}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-latin-700-normal.woff2) format('woff2');font-display:block}
/* "Night Bazaar Ledger" — fixed grid (same discipline as the trading-pipeline and cloud-chamber benchmarks):
   y150 step tracker · y214 eyebrow + live counter · y252 headline (key phrase in a solid block) · y480-1150 stage (one continuous world, camera inside a framed window)
   · y1170-1536 host tile (right) + caption panel with dashed rule (left). Nothing below y1536. Colour: amber = the money packet, mint = UPI lane, red = no reply, cream = receipts. */
:root{--bg:#0a0f2e;--am:#ffb03a;--mt:#2de2c0;--rd:#ff4057;--cr:#f3ead6;--ink:#0a0f2e}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden}
canvas#cv{position:absolute;left:0;top:0}
.chip{position:absolute;top:150px;height:46px;width:180px;border-radius:23px;border:3px solid rgba(243,234,214,.3);color:rgba(243,234,214,.55);font:600 25px/40px BS;letter-spacing:.06em;text-align:center;text-transform:uppercase;background:rgba(10,15,46,.6)}
.chip.on{border-color:var(--mt);color:var(--ink);background:var(--mt)}
#eye{position:absolute;left:150px;top:214px;width:500px;font:500 19px/1.2 DM;letter-spacing:.04em;color:var(--cr);white-space:nowrap;overflow:hidden;text-overflow:clip}
#eye i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--am);margin-right:10px;vertical-align:0}
#cnt{position:absolute;left:668px;top:206px;width:250px;text-align:right;font:500 16px/1.1 DM;letter-spacing:.03em;color:var(--mt);white-space:nowrap}
#cnt b{display:block;font:800 34px/1 BS;color:var(--cr);letter-spacing:.02em}
#hl{position:absolute;left:150px;top:272px;width:768px;height:200px;font:800 94px/1.0 BS;color:var(--cr);text-transform:uppercase;letter-spacing:-.005em;text-shadow:0 4px 18px rgba(0,0,0,.6)}
#hl em{font-style:normal;display:inline-block;background:var(--am);color:var(--ink);padding:0 14px;margin:0 -2px;text-shadow:none}
#stl,#str{position:absolute;top:490px;font:500 19px/1 DM;letter-spacing:.09em;color:rgba(243,234,214,.75);white-space:nowrap}
#stl{left:172px}#str{right:172px;text-align:right}
#str.pulse{color:var(--am)}
#capw{position:absolute;left:150px;top:1232px;width:372px;min-height:150px;padding:20px 18px 18px;background:rgba(10,15,46,.82);border:2px solid rgba(243,234,214,.18);border-radius:10px;font:700 35px/1.22 Inter;color:var(--cr)}
#capw b{color:var(--am);font-weight:700}
#capr{position:absolute;left:150px;top:1214px;width:372px;border-top:3px dashed var(--am)}
#hostw{position:absolute;left:538px;top:1160px;width:380px;height:376px;overflow:hidden}
#hostw canvas{position:absolute;left:0;top:0;width:380px;height:380px;filter:drop-shadow(0 0 16px rgba(255,176,58,.3))}
#endc{position:absolute;left:150px;top:540px;width:768px;height:600px;opacity:0}
#pf{position:absolute;left:34px;top:150px;width:220px;height:220px;border-radius:50%;background:url(profile.jpg) center/cover;border:7px solid var(--cr);box-shadow:0 0 0 7px var(--am),0 12px 30px rgba(0,0,0,.6)}
#hd{position:absolute;left:290px;top:176px;font:800 66px/1 BS;color:var(--cr);letter-spacing:.01em}
#sub{position:absolute;left:290px;top:250px;font:500 22px/1.3 DM;color:var(--mt);letter-spacing:.08em;width:460px}
.btn{position:absolute;top:410px;height:96px;width:226px;border-radius:48px;font:800 50px/90px BS;text-align:center;letter-spacing:.04em;border:5px solid var(--cr);color:var(--ink);background:var(--cr)}
#b1{left:24px}#b2{left:271px;background:var(--am)}#b3{left:518px;background:var(--rd);color:var(--cr)}
</style></head><body>
<canvas id="cv" width="1080" height="1920"></canvas>
<div id="chips"></div><div id="eye"></div><div id="cnt"></div><div id="hl"></div><div id="stl">UPI FLOW · ILLUSTRATION</div><div id="str"></div>
<div id="endc"><div id="pf"></div><div id="hd">@sandeshexplains</div><div id="sub">SAVE THE STUCK-PAYMENT RULE:<br>REF ID · 5 DAYS · ₹100/DAY</div><div class="btn" id="b1">LIKE</div><div class="btn" id="b2">SHARE</div><div class="btn" id="b3">SUBSCRIBE</div></div>
<div id="capr"></div><div id="capw"></div><div id="hostw"><canvas id="avc" width="544" height="544"></canvas></div>
<video id="hostv" muted preload="auto" src="host.webm" style="display:none"></video>
<script src="timing.js"></script><script src="app.js"></script></body></html>
