<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:'Anton';src:url('cover-assets/anton-latin-400-normal.woff2');font-display:block}
@font-face{font-family:'JetBrains Mono';font-weight:700;src:url('cover-assets/jbmono-700.woff2');font-display:block}
html,body{margin:0;background:#05060c}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#2a1458 0%,#0a0820 60%,#05060c 100%);font-family:Anton,sans-serif}
.map{position:absolute;left:-140px;top:300px;width:1360px;opacity:.9;filter:brightness(1.9) contrast(1.15) saturate(1.5);-webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 30%,transparent 72%)}
.ring{position:absolute;left:190px;top:420px;width:700px;height:700px;border-radius:50%;border:56px solid #ff6a1a;box-sizing:border-box;box-shadow:0 0 90px 10px rgba(255,106,26,.55),inset 0 0 70px rgba(255,106,26,.4);background:rgba(5,6,12,.55)}
.ring:after{content:'';position:absolute;inset:-56px;border-radius:50%;border:56px solid transparent;border-top-color:#05060c;border-right-color:#05060c;transform:rotate(-38deg);opacity:.0}
.ten{position:absolute;left:150px;top:520px;width:700px;text-align:center;font-size:520px;line-height:1;color:#eef0fa;text-shadow:0 10px 40px rgba(0,0,0,.7)}
.slash{position:absolute;left:150px;top:765px;width:800px;height:46px;background:#ff2d7a;box-shadow:0 0 70px 14px rgba(255,45,122,.6);transform:rotate(-12deg)}
.sco{position:absolute;left:430px;top:700px;width:640px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.6))}
.t1{position:absolute;left:90px;top:1110px;font-size:190px;line-height:.95;color:#f4f5ff;text-shadow:0 8px 30px rgba(0,0,0,.8);letter-spacing:.005em}
.t2{position:absolute;left:90px;top:1282px;font-size:210px;line-height:1;color:#1a0900;background:#ff6a1a;padding:0 30px;transform:skewX(-6deg);transform-origin:0 100%}
.face{position:absolute;left:790px;top:1505px;width:160px;height:160px;border-radius:50%;border:7px solid #eef0fa;box-shadow:0 0 0 6px #ff6a1a,0 0 50px 8px rgba(255,106,26,.55);overflow:hidden}
.face img{width:100%;height:100%;object-fit:cover}
.num{position:absolute;left:90px;top:430px;font:700 38px 'JetBrains Mono';letter-spacing:.16em;color:#c6ff1a;border:3px solid #c6ff1a;padding:8px 18px;border-radius:10px;background:rgba(5,6,12,.7)}
