<!doctype html><meta charset="utf-8"><title>Game ke pixels</title>
<style>
@font-face{font-family:'Tight';font-weight:200;src:url('fonts/inter-tight-latin-200-normal.woff2');font-display:block}
@font-face{font-family:'Tight';font-weight:300;src:url('fonts/inter-tight-latin-300-normal.woff2');font-display:block}
@font-face{font-family:'Inter';font-weight:600;src:url('fonts/inter-latin-600-normal.woff2');font-display:block}
@font-face{font-family:'Inter';font-weight:800;src:url('fonts/inter-latin-800-normal.woff2');font-display:block}
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#030304;font-family:Inter,sans-serif;color:#f1f3f8}
#gl{position:absolute;left:0;top:0;width:1080px;height:1920px}
.ov{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.ov>div{position:absolute}
#cap{position:absolute;z-index:20;left:150px;width:768px;top:1350px;text-align:center}
</style>
<div id="stage"><canvas id="gl" width="1080" height="1920"></canvas><div class="ov" id="ov"></div><div id="cap"></div></div>
<script>window.__ready=false;</script><script src="three.min.js"></script><script src="timing.js"></script><script src="captions.js"></script>
<script>Promise.all(['200 40px Tight','300 30px Tight','600 30px Inter','800 30px Inter'].map(function(f){return document.fonts.load(f)})).then(function(){var s=document.createElement('script');s.src='world.js';document.body.appendChild(s)})</script>
