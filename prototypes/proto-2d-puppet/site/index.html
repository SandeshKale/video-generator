<!doctype html><meta charset=utf8><style>html,body{margin:0;background:#f6efe2}canvas{display:block}</style><canvas id=c width=1080 height=1920></canvas>
<script src="mocap.js"></script><script src="rig.js"></script><script src="puppet.js"></script><script src="motion.js"></script><script>
var c=document.getElementById('c'),x=c.getContext('2d'),ready=false;window.__reelDurationSec=4;
function tri(t,d){var m=t%(2*d);return m<d?m:2*d-m;}
var pose=function(t){return MOTION.pose(t);};
window.POSE=pose;
window.frame=function(t,ox,oy,sc){ x.fillStyle='#f6efe2';x.fillRect(0,0,1080,1920);
 x.fillStyle='#2b3bff18';for(var i=0;i<1080;i+=34)for(var j=0;j<1920;j+=34){x.beginPath();x.arc(i+((j/34)%2)*17,j,3,0,7);x.fill();}
 var g=1450;x.fillStyle='#14123a';x.fillRect(0,g,1080,10);x.fillStyle='#ff5a3633';x.fillRect(0,g+10,1080,120);
 // shadow is drawn first from a dry pass so it can sit under the feet
 var tmp=document.createElement('canvas').getContext('2d');var info=PUPPET.draw(tmp,pose(t),{x:540,y:g,scale:sc||1.1,guardSpread:1.0,fa:MOTION.fa()});
 var lx=info.soles.L[0],rx=info.soles.R[0],cl=Math.min(g-info.soles.L[1],g-info.soles.R[1]),lift=(Math.abs(g-info.soles.L[1])+Math.abs(g-info.soles.R[1]))/2,cx=0.5*info.hip[0]+0.5*(lx+rx)/2,wd=130+Math.abs(lx-rx)*0.45;
 x.fillStyle='rgba(20,18,58,'+(0.28*(1-Math.min(1,lift/160))).toFixed(3)+')';x.beginPath();x.ellipse(cx,g+22,wd,24,0,0,7);x.fill();
 info=PUPPET.draw(x,pose(t),{x:540,y:g,scale:sc||1.1,guardSpread:1.0,fa:MOTION.fa()}); return info; };
window.__seek=function(t){ if(!ready)return; window.frame(t); };
PUPPET.load(function(){ready=true;window.__seek(0);window.done=1;});
</script>
